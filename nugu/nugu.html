<style>

.form-group{margin-bottom:18px}.form-group label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.post-content{white-space:pre-wrap;line-height:1.75;min-height:150px;padding:20px;background:#f8fbff;border-radius:10px;margin-top:18px}.post-info{color:#7b8898;font-size:13px;padding-bottom:15px;border-bottom:1px solid #e6edf5}.post-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}
.comments{margin-top:30px}.comments h3{margin:0 0 15px;font-size:17px}.comment{padding:14px 0;border-bottom:1px solid #edf1f6}.comment-meta{font-size:12px;color:#7c8998;margin-bottom:6px}.comment-content{white-space:pre-wrap;line-height:1.5}
.comment-form{margin-top:18px;display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:8px;align-items:stretch;width:100%}.comment-form input{min-width:0}.comment-form textarea{min-width:0;width:100%;min-height:75px;height:75px;resize:vertical}.comment-form button{height:75px;white-space:nowrap}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.status{position:fixed;right:20px;bottom:20px;background:#17253d;color:#fff;padding:13px 17px;border-radius:10px;font-size:13px;display:none;z-index:300}
.admin-panel{margin-top:15px;border:1px solid #d8e3f2;border-radius:12px;overflow:hidden}.admin-panel h3{margin:0;padding:14px 16px;background:#f7faff;font-size:16px}.admin-list{max-height:360px;overflow:auto}.admin-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid #edf1f6}.admin-row-main{min-width:0}.admin-row-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.admin-row-meta{font-size:12px;color:#7c8998;margin-top:4px}.admin-row button{flex-shrink:0}.admin-tabs{display:flex;gap:8px;margin-bottom:14px}.admin-tabs button.active{background:#2563a8;color:#fff}.admin-empty{padding:25px;text-align:center;color:#8997a8}
.notice{background:#fff8d8;border:1px solid #ffe477;color:#685700;padding:12px;border-radius:10px;font-size:13px;line-height:1.5;margin-bottom:15px}
@media(max-width:700px){.container{margin:20px auto;padding:0 10px}.header-inner{padding:17px;flex-wrap:wrap}.header-actions{width:100%}.header-actions button{flex:1}.board-top{padding:20px}.post-list th:nth-child(3),.post-list td:nth-child(3),.post-list th:nth-child(4),.post-list td:nth-child(4){display:none}.post-list th,.post-list td{padding:13px 8px}.modal{margin:10px auto}.comment-form{grid-template-columns:1fr}.comment-form textarea{height:110px;min-height:110px}.comment-form button{height:auto}.search-area{padding:15px}.post-actions{flex-wrap:wrap}.admin-row{align-items:flex-start}}

<body>
<header>
<div class="header-inner">
<a class="logo" href="index.html" aria-label="홈으로 이동"><span>NUGU</span> 자유게시판</a>
<div class="header-actions">
<span id="loginState" style="font-size:13px;color:#62748a"></span>
<button class="secondary" onclick="goNuguHome()">NUGU 홈</button>
<button id="adminButton" class="secondary hidden" onclick="openAdmin()">관리자</button>
<button id="loginButton" class="primary hidden" onclick="loginWithGoogle()">Google 로그인</button>
<button id="logoutButton" class="secondary hidden" onclick="logout()">로그아웃</button>
</div>
</div>
</header>

<div class="container">
<div class="board">
<div class="board-top">
<div><h1 class="board-title">NUGU 자유게시판</h1><p class="board-description">누구나 자유롭게 이야기를 나눌 수 있는 공간입니다.</p></div>
<button class="primary" onclick="openWrite()">글쓰기</button>
</div>
<div id="authNotice" class="notice hidden" style="margin:15px 25px 0">글과 댓글을 작성하려면 Google 로그인이 필요합니다.</div>
<div class="search-area">
<input id="searchInput" placeholder="제목 또는 내용 검색" onkeydown="if(event.key==='Enter')searchPosts()">
<button class="secondary" onclick="searchPosts()">검색</button>
<button class="secondary" onclick="loadPosts()">전체</button>
</div>
<div id="listArea"><div class="loading">게시글을 불러오는 중...</div></div>
</div>
</div>

<div class="modal-bg" id="writeModal"><div class="modal"><div class="modal-header"><h2>새 글 작성</h2><button class="close" onclick="closeModal('writeModal')">×</button></div><div class="modal-body">
<div class="form-group"><label>작성자</label><input id="writeAuthor" maxlength="30"></div>
<div class="form-group"><label>제목</label><input id="writeTitle" maxlength="100"></div>
<div class="form-group"><label>내용</label><textarea id="writeContent" maxlength="10000"></textarea></div>
<div class="form-group"><label>비밀번호</label><input id="writePassword" type="password" maxlength="50" placeholder="수정 또는 삭제할 때 사용합니다"></div>
<div class="form-actions"><button class="secondary" onclick="closeModal('writeModal')">취소</button><button class="primary" onclick="createPost()">게시하기</button></div>
</div></div></div>

<div class="modal-bg" id="viewModal"><div class="modal"><div class="modal-header"><h2 id="viewTitle"></h2><button class="close" onclick="closeModal('viewModal')">×</button></div><div class="modal-body">
<div class="post-info" id="viewInfo"></div><div class="post-content" id="viewContent"></div>
<div class="post-actions"><button class="secondary" onclick="editPost()">수정</button><button class="danger" onclick="deletePost()">삭제</button></div>
<div class="comments"><h3>댓글</h3><div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button type="button" class="secondary" style="padding:7px 10px;font-size:12px" onclick="loadComments(currentPostId)">댓글 새로고침</button></div>
<div id="commentList"><div class="loading">댓글을 불러오는 중...</div></div>
<div style="font-size:13px;color:#62748a;margin:15px 0 8px;font-weight:700">댓글 작성</div>
<div class="comment-form"><input id="commentAuthor" maxlength="30" placeholder="작성자"><textarea id="commentContent" maxlength="3000" placeholder="댓글을 입력하세요"></textarea><button class="primary" onclick="submitNuguComment()">등록</button></div>
</div></div></div></div>

<div class="modal-bg" id="editModal"><div class="modal"><div class="modal-header"><h2>게시글 수정</h2><button class="close" onclick="closeModal('editModal')">×</button></div><div class="modal-body">
<div class="form-group"><label>제목</label><input id="editTitle" maxlength="100"></div><div class="form-group"><label>내용</label><textarea id="editContent" maxlength="10000"></textarea></div><div class="form-group"><label>비밀번호</label><input id="editPassword" type="password" maxlength="50" placeholder="글 작성 시 설정한 비밀번호"></div>
<div class="form-actions"><button class="secondary" onclick="closeModal('editModal')">취소</button><button class="primary" onclick="saveEdit()">수정 완료</button></div>
</div></div></div>

<div class="modal-bg" id="adminModal"><div class="modal"><div class="modal-header"><h2>관리자</h2><button class="close" onclick="closeAdmin()">×</button></div>
<div class="modal-body" id="adminPanelArea"><div class="admin-tabs"><button id="adminPostTab" class="secondary active" onclick="showAdminPosts()">게시글 관리</button><button id="adminCommentTab" class="secondary" onclick="showAdminComments()">댓글 관리</button></div><div id="adminContent"><div class="loading">불러오는 중...</div></div><div class="form-actions"><button class="secondary" onclick="closeAdmin()">닫기</button></div></div>
</div></div>

<div class="status" id="status"></div>

<script>
const SUPABASE_URL="https://aqtutjsubqplnjphinjq.supabase.co";
const SUPABASE_KEY="sb_publishable__oSX4ddCVrL3SbHY1m_fEw_OOzfidzO";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentProfile=null,currentPostId=null,currentPost=null,isAdmin=false,boardChannel=null;

document.addEventListener("DOMContentLoaded",initBoard);

async function initBoard(){
  const {data:{session}}=await db.auth.getSession();
  await applySession(session);
  db.auth.onAuthStateChange((_e,session)=>setTimeout(()=>applySession(session),0));
  subscribeRealtime();
}

async function applySession(session){
  currentUser=session?.user||null;
  currentProfile=null;
  isAdmin=false;

  if(currentUser){
    const {data}=await db.from("nugu_profiles").select("*").eq("id",currentUser.id).maybeSingle();
    currentProfile=data||null;
    isAdmin=currentProfile?.is_admin===true;
    document.getElementById("loginState").textContent=currentProfile?`@${currentProfile.username}`:"로그인됨";
    document.getElementById("loginButton").classList.add("hidden");
    document.getElementById("logoutButton").classList.remove("hidden");
    document.getElementById("adminButton").classList.toggle("hidden",!isAdmin);
    document.getElementById("authNotice").classList.add("hidden");

    if(currentProfile){
      document.getElementById("writeAuthor").value=currentProfile.display_name||currentProfile.username||"";
      document.getElementById("commentAuthor").value=currentProfile.display_name||currentProfile.username||"";
    }
  }else{
    document.getElementById("loginState").textContent="";
    document.getElementById("loginButton").classList.remove("hidden");
    document.getElementById("logoutButton").classList.add("hidden");
    document.getElementById("adminButton").classList.add("hidden");
    document.getElementById("authNotice").classList.remove("hidden");
  }
  await loadPosts();
}

async function loginWithGoogle(){
  const {error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.origin+window.location.pathname}});
  if(error)alert("Google 로그인에 실패했습니다.\n"+error.message);
}
async function logout(){await db.auth.signOut();location.reload()}
function goNuguHome(){location.href="index.html"}

function showStatus(text){
  const box=document.getElementById("status");box.textContent=text;box.style.display="block";
  setTimeout(()=>box.style.display="none",2500);
}
function formatDate(date){return new Date(date).toLocaleString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}
function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}

function requireLogin(){
  if(currentUser)return true;
  alert("Google 로그인이 필요합니다.");
  return false;
}

async function loadPosts(){
  const area=document.getElementById("listArea");area.innerHTML='<div class="loading">게시글을 불러오는 중...</div>';
  const {data,error}=await db.from("nugu_posts").select("*").order("created_at",{ascending:false});
  if(error){console.error(error);area.innerHTML=`<div class="empty">게시글을 불러오지 못했습니다.<br><small>${escapeHTML(error.message)}</small></div>`;return}
  renderPosts(data||[]);
}
function renderPosts(posts){
  const area=document.getElementById("listArea");
  if(!posts.length){area.innerHTML='<div class="empty">아직 게시글이 없습니다.<br>첫 번째 글을 작성해보세요.</div>';return}
  let html='<table class="post-list"><thead><tr><th>번호</th><th>제목</th><th>작성자</th><th>작성일</th><th>조회</th></tr></thead><tbody>';
  posts.forEach((post,index)=>{html+=`<tr><td>${posts.length-index}</td><td class="title"><span class="post-title" onclick="openPost(${post.id})">${escapeHTML(post.title)}</span></td><td>${escapeHTML(post.author)}</td><td>${formatDate(post.created_at)}</td><td>${post.views||0}</td></tr>`});
  area.innerHTML=html+"</tbody></table>";
}

function openWrite(){
  if(!requireLogin())return;
  if(currentProfile){
    document.getElementById("writeAuthor").value=currentProfile.display_name||currentProfile.username||"";
  }
  document.getElementById("writeModal").style.display="block";
}

async function createPost(){
  if(!requireLogin())return;
  const author=document.getElementById("writeAuthor").value.trim(),title=document.getElementById("writeTitle").value.trim(),content=document.getElementById("writeContent").value.trim(),password=document.getElementById("writePassword").value;
  if(!author){alert("작성자를 입력해주세요.");return}
  if(!title){alert("제목을 입력해주세요.");return}
  if(!content){alert("내용을 입력해주세요.");return}
  if(password.length<4){alert("비밀번호는 4자 이상 입력해주세요.");return}

  const {data,error}=await db.rpc("nugu_create_post",{p_author:author,p_title:title,p_content:content,p_password:password});
  if(error){console.error(error);alert("게시글 등록에 실패했습니다.\n\n"+error.message);return}
  if(data===false){alert("게시글 등록에 실패했습니다.");return}

  document.getElementById("writeTitle").value="";
  document.getElementById("writeContent").value="";
  document.getElementById("writePassword").value="";
  closeModal("writeModal");showStatus("게시글이 등록되었습니다.");await loadPosts();
}

async function openPost(id){
  currentPostId=id;
  const {data,error}=await db.from("nugu_posts").select("*").eq("id",id).single();
  if(error||!data){alert("게시글을 불러오지 못했습니다.");return}
  currentPost=data;
  await db.rpc("nugu_increment_views",{post_id:id});
  document.getElementById("viewTitle").textContent=data.title;
  document.getElementById("viewInfo").textContent=`${data.author} · ${formatDate(data.created_at)} · 조회 ${(data.views||0)+1}`;
  document.getElementById("viewContent").textContent=data.content;
  document.getElementById("viewModal").style.display="block";
  await loadComments(id);
}

function editPost(){
  if(!currentPost)return;
  if(!requireLogin())return;
  document.getElementById("editTitle").value=currentPost.title;
  document.getElementById("editContent").value=currentPost.content;
  document.getElementById("editPassword").value="";
  document.getElementById("editModal").style.display="block";
}
async function saveEdit(){
  if(!requireLogin())return;
  const title=document.getElementById("editTitle").value.trim(),content=document.getElementById("editContent").value.trim(),password=document.getElementById("editPassword").value;
  if(!title||!content||!password){alert("제목, 내용, 비밀번호를 모두 입력해주세요.");return}
  const {data,error}=await db.rpc("nugu_update_post",{p_id:currentPostId,p_password:password,p_title:title,p_content:content});
  if(error){alert("수정 중 오류가 발생했습니다.\n\n"+error.message);return}
  if(data!==true){alert("비밀번호가 올바르지 않습니다.");return}
  closeModal("editModal");showStatus("게시글이 수정되었습니다.");await loadPosts();await openPost(currentPostId);
}

async function deletePost(){
  if(!currentPostId||!requireLogin())return;
  const password=prompt("게시글 작성 시 설정한 비밀번호를 입력하세요.");
  if(password===null)return;
  if(!password){alert("비밀번호를 입력해주세요.");return}
  if(!confirm("정말 이 게시글을 삭제하시겠습니까?"))return;
  const {data,error}=await db.rpc("nugu_delete_post",{p_id:currentPostId,p_password:password});
  if(error){alert("삭제 중 오류가 발생했습니다.\n\n"+error.message);return}
  if(data!==true){alert("비밀번호가 올바르지 않습니다.");return}
  closeModal("viewModal");showStatus("게시글이 삭제되었습니다.");currentPostId=null;currentPost=null;await loadPosts();
}

async function loadComments(postId){
  const box=document.getElementById("commentList");if(!box)return;
  box.innerHTML='<div class="loading">댓글을 불러오는 중...</div>';
  const {data,error}=await db.from("nugu_comments").select("id,post_id,author,content,created_at").eq("post_id",postId).order("created_at",{ascending:true});
  if(error){box.innerHTML=`<div class="empty">댓글을 불러오지 못했습니다.<br><small>${escapeHTML(error.message)}</small></div>`;return}
  if(!data?.length){box.innerHTML='<div class="empty">아직 댓글이 없습니다.</div>';return}
  box.innerHTML=data.map(c=>`<div class="comment"><div class="comment-meta">${escapeHTML(c.author||"익명")} · ${formatDate(c.created_at)} ${isAdmin?`<button type="button" class="danger" style="padding:4px 8px;font-size:11px;margin-left:6px" onclick="adminDeleteComment(${c.id})">삭제</button>`:""}</div><div class="comment-content">${escapeHTML(c.content||"")}</div></div>`).join("");
}

  async function submitNuguComment(){
  console.log("=== 댓글 등록 시작 ===");

  if(!currentUser){
    alert("Google 로그인이 필요합니다.");
    return;
  }

  if(!currentPostId){
    alert("게시글 정보가 없습니다. 게시글을 다시 열어주세요.");
    return;
  }

  const authorInput=document.getElementById("commentAuthor");
  const contentInput=document.getElementById("commentContent");

  if(!authorInput || !contentInput){
    alert("댓글 입력창을 찾을 수 없습니다.");
    return;
  }

  const author=authorInput.value.trim();
  const content=contentInput.value.trim();

  if(!author){
    alert("작성자를 입력해주세요.");
    return;
  }

  if(!content){
    alert("댓글 내용을 입력해주세요.");
    return;
  }

  const {data,error}=await db
    .from("nugu_comments")
    .insert({
      post_id:Number(currentPostId),
      author:author,
      content:content
    })
    .select();

  console.log("댓글 INSERT 결과:",data);
  console.log("댓글 INSERT 오류:",error);

  if(error){
    alert("댓글 등록에 실패했습니다.\n\n"+error.message);
    return;
  }

  contentInput.value="";
  showStatus("댓글이 등록되었습니다.");

  await loadComments(currentPostId);
}
async function searchPosts(){
  const keyword=document.getElementById("searchInput").value.trim();
  if(!keyword){await loadPosts();return}
  const safe=keyword.replace(/,/g,"");
  const {data,error}=await db.from("nugu_posts").select("*").or(`title.ilike.%${safe}%,content.ilike.%${safe}%`).order("created_at",{ascending:false});
  if(error){alert("검색 중 오류가 발생했습니다.\n"+error.message);return}
  renderPosts(data||[]);
}

function openAdmin(){
  if(!isAdmin){alert("관리자 권한이 없습니다.");return}
  document.getElementById("adminModal").style.display="block";showAdminPosts();
}
function closeAdmin(){document.getElementById("adminModal").style.display="none"}
function setAdminTab(active){
  document.getElementById("adminPostTab").classList.toggle("active",active==="posts");
  document.getElementById("adminCommentTab").classList.toggle("active",active==="comments");
}

async function showAdminPosts(){
  if(!isAdmin)return;setAdminTab("posts");
  const box=document.getElementById("adminContent");box.innerHTML='<div class="loading">게시글을 불러오는 중...</div>';
  const {data,error}=await db.from("nugu_posts").select("id,author,title,created_at,views").order("created_at",{ascending:false});
  if(error){box.innerHTML='<div class="admin-empty">게시글을 불러오지 못했습니다.</div>';return}
  if(!data.length){box.innerHTML='<div class="admin-empty">게시글이 없습니다.</div>';return}
  box.innerHTML='<div class="admin-panel"><h3>게시글 '+data.length+'개</h3><div class="admin-list">'+data.map(p=>`<div class="admin-row"><div class="admin-row-main"><div class="admin-row-title">${escapeHTML(p.title)}</div><div class="admin-row-meta">${escapeHTML(p.author)} · ${formatDate(p.created_at)} · 조회 ${p.views||0}</div></div><button class="danger" onclick="adminDeletePost(${p.id})">강제 삭제</button></div>`).join("")+'</div></div>';
}

async function showAdminComments(){
  if(!isAdmin)return;setAdminTab("comments");
  const box=document.getElementById("adminContent");box.innerHTML='<div class="loading">댓글을 불러오는 중...</div>';
  const {data,error}=await db.from("nugu_comments").select("id,post_id,author,content,created_at").order("created_at",{ascending:false});
  if(error){box.innerHTML='<div class="admin-empty">댓글을 불러오지 못했습니다.</div>';return}
  if(!data.length){box.innerHTML='<div class="admin-empty">댓글이 없습니다.</div>';return}
  const ids=[...new Set(data.map(c=>c.post_id))];
  const {data:posts}=await db.from("nugu_posts").select("id,title").in("id",ids);
  const map=new Map((posts||[]).map(p=>[p.id,p.title]));
  box.innerHTML='<div class="admin-panel"><h3>댓글 '+data.length+'개</h3><div class="admin-list">'+data.map(c=>`<div class="admin-row"><div class="admin-row-main"><div class="admin-row-title">${escapeHTML(c.content)}</div><div class="admin-row-meta">${escapeHTML(c.author)} · ${formatDate(c.created_at)} · ${escapeHTML(map.get(c.post_id)||"삭제된 게시글")}</div></div><button class="danger" onclick="adminDeleteComment(${c.id})">강제 삭제</button></div>`).join("")+'</div></div>';
}

async function adminDeletePost(id){
  if(!isAdmin)return;
  if(!confirm("관리자 권한으로 이 게시글을 삭제하시겠습니까?\n댓글도 함께 삭제됩니다."))return;
  /* authenticated용 DELETE 정책을 사용해 관리자 권한으로 직접 삭제한다. */
  const {error}=await db.from("nugu_posts").delete().eq("id",id);
  if(error){alert("관리자 게시글 삭제 실패:\n"+error.message);return}
  showStatus("게시글이 삭제되었습니다.");await loadPosts();await showAdminPosts();
}

async function adminDeleteComment(id){
  if(!isAdmin)return;
  if(!confirm("관리자 권한으로 이 댓글을 삭제하시겠습니까?"))return;

  /* 현재 authenticated DELETE 정책으로 관리자도 직접 삭제한다. */
  const {error}=await db.from("nugu_comments").delete().eq("id",id);
  if(error){alert("댓글 삭제 실패:\n"+error.message);return}
  showStatus("댓글이 삭제되었습니다.");
  if(currentPostId)await loadComments(currentPostId);
  await showAdminComments();
}

function closeModal(id){document.getElementById(id).style.display="none"}
document.querySelectorAll(".modal-bg").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.style.display="none"}));

function subscribeRealtime(){
  if(boardChannel)return;
  boardChannel=db.channel("nugu-board-realtime")
    .on("postgres_changes",{event:"*",schema:"public",table:"nugu_posts"},()=>loadPosts())
    .on("postgres_changes",{event:"*",schema:"public",table:"nugu_comments"},()=>{if(currentPostId)loadComments(currentPostId)})
    .subscribe(status=>console.log("board realtime:",status));
}
</script>
