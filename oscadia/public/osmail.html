<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSmail</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  color:#202124;
  background:#fff;
}

header{
  height:64px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  padding:0 22px;
  gap:25px;
}

.logo{
  font-size:25px;
  font-weight:700;
  letter-spacing:-1px;
}

.search{
  flex:1;
  max-width:650px;
}

.search input{
  width:100%;
  height:42px;
  border:0;
  background:#f1f3f4;
  border-radius:22px;
  padding:0 20px;
  outline:none;
}

.oscadia{
  margin-left:auto;
  border:0;
  background:white;
  padding:9px 13px;
  cursor:pointer;
  border-radius:8px;
}

.oscadia:hover{
  background:#f1f3f4;
}

.layout{
  display:flex;
  min-height:calc(100vh - 64px);
}

.sidebar{
  width:235px;
  padding:20px 12px;
  border-right:1px solid #eee;
}

.compose{
  width:150px;
  height:50px;
  border:0;
  border-radius:25px;
  background:#222;
  color:white;
  font-size:15px;
  cursor:pointer;
  margin-bottom:20px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.menu button{
  border:0;
  background:white;
  text-align:left;
  padding:12px 17px;
  border-radius:20px;
  cursor:pointer;
  font-size:14px;
}

.menu button:hover{
  background:#f1f3f4;
}

.menu button.active{
  background:#eee;
  font-weight:700;
}

.content{
  flex:1;
  min-width:0;
}

.toolbar{
  height:60px;
  display:flex;
  align-items:center;
  padding:0 22px;
  border-bottom:1px solid #eee;
}

.toolbar button{
  border:0;
  background:white;
  cursor:pointer;
  padding:9px;
  border-radius:50%;
}

.toolbar button:hover{
  background:#f1f3f4;
}

.mail-list{
  width:100%;
}

.mail{
  min-height:58px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:15px;
  cursor:pointer;
}

.mail:hover{
  background:#f8f9fa;
}

.mail.unread{
  background:#fff;
  font-weight:700;
}

.mail-sender{
  width:180px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.mail-subject{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.mail-date{
  color:#777;
  font-size:12px;
}

.empty{
  padding:80px 20px;
  text-align:center;
  color:#777;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.compose-window{
  width:min(650px,94%);
  background:white;
  border-radius:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.25);
  overflow:hidden;
}

.compose-header{
  height:48px;
  background:#f1f3f4;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  font-weight:700;
}

.close{
  border:0;
  background:transparent;
  font-size:20px;
  cursor:pointer;
}

.field{
  display:flex;
  border-bottom:1px solid #eee;
  padding:0 15px;
}

.field label{
  width:60px;
  padding:13px 0;
  color:#666;
}

.field input{
  flex:1;
  border:0;
  outline:none;
  padding:13px 0;
}

textarea{
  width:100%;
  height:280px;
  border:0;
  outline:none;
  resize:none;
  padding:18px;
  font-family:inherit;
  font-size:14px;
}

.compose-footer{
  padding:12px 15px;
  border-top:1px solid #eee;
}

.send{
  border:0;
  background:#222;
  color:white;
  border-radius:20px;
  padding:10px 22px;
  cursor:pointer;
}

.read-window{
  width:min(700px,94%);
  max-height:85vh;
  overflow:auto;
  background:white;
  border-radius:10px;
  padding:25px;
}

.read-header{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #eee;
  padding-bottom:18px;
}

.read-body{
  white-space:pre-wrap;
  line-height:1.7;
  padding-top:25px;
}

@media(max-width:700px){
  .sidebar{
    width:70px;
  }

  .compose{
    width:45px;
    font-size:0;
    margin-left:auto;
    margin-right:auto;
  }

  .compose::after{
    content:"+";
    font-size:25px;
  }

  .menu button{
    font-size:0;
    text-align:center;
  }

  .menu button::first-letter{
    font-size:20px;
  }

  .mail-sender{
    width:100px;
  }

  .mail-date{
    display:none;
  }

  header{
    padding:0 12px;
    gap:10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">OSmail</div>

  <div class="search">
    <input
      id="mailSearch"
      type="text"
      placeholder="메일 검색"
      oninput="renderMails()"
    >
  </div>

  <button class="oscadia" onclick="location.href='oscadia.html'">
    OSCADIA
  </button>
</header>

<div class="layout">

  <aside class="sidebar">

    <button class="compose" onclick="openCompose()">
      메일 작성
    </button>

    <div class="menu">
      <button class="active" onclick="changeFolder('inbox',this)">
        받은메일함
      </button>

      <button onclick="changeFolder('sent',this)">
        보낸메일함
      </button>

      <button onclick="changeFolder('trash',this)">
        휴지통
      </button>
    </div>

  </aside>

  <main class="content">

    <div class="toolbar">
      <button onclick="renderMails()" title="새로고침">↻</button>
    </div>

    <div id="mailList" class="mail-list"></div>

  </main>

</div>


<!-- 메일 작성 -->

<div id="composeModal" class="modal">

  <div class="compose-window">

    <div class="compose-header">
      <span>새 메일</span>
      <button class="close" onclick="closeCompose()">×</button>
    </div>

    <div class="field">
      <label>받는 사람</label>
      <input id="toInput" type="text" placeholder="example@osmail.local">
    </div>

    <div class="field">
      <label>제목</label>
      <input id="subjectInput" type="text" placeholder="제목">
    </div>

    <textarea id="bodyInput" placeholder="메일 내용을 입력하세요."></textarea>

    <div class="compose-footer">
      <button class="send" onclick="sendMail()">보내기</button>
    </div>

  </div>

</div>


<!-- 메일 읽기 -->

<div id="readModal" class="modal">

  <div class="read-window">

    <div class="read-header">
      <div>
        <div id="readSubject" style="font-size:21px;font-weight:700"></div>
        <div id="readSender" style="color:#777;margin-top:8px"></div>
      </div>

      <button class="close" onclick="closeRead()">×</button>
    </div>

    <div id="readBody" class="read-body"></div>

  </div>

</div>


<script>

let mails = JSON.parse(
  localStorage.getItem("osmail_mails") || "null"
);

if(!mails){
  mails = [
    {
      id:Date.now(),
      folder:"inbox",
      sender:"OSmail",
      to:"cucu@osmail.local",
      subject:"OSmail에 오신 것을 환영합니다.",
      body:"OSmail 테스트 메일입니다.\n\n메일 작성 버튼을 눌러 새로운 메일을 만들어 보세요.",
      date:new Date().toLocaleDateString(),
      unread:true
    }
  ];

  save();
}

let currentFolder="inbox";


function save(){
  localStorage.setItem(
    "osmail_mails",
    JSON.stringify(mails)
  );
}


function renderMails(){

  const list=document.getElementById("mailList");
  const query=document
    .getElementById("mailSearch")
    .value
    .trim()
    .toLowerCase();

  let filtered=mails.filter(mail =>
    mail.folder===currentFolder
  );

  if(query){
    filtered=filtered.filter(mail =>
      (
        mail.sender+" "+
        mail.to+" "+
        mail.subject+" "+
        mail.body
      ).toLowerCase().includes(query)
    );
  }

  if(filtered.length===0){
    list.innerHTML=
      `<div class="empty">메일이 없습니다.</div>`;
    return;
  }

  list.innerHTML=filtered.map(mail=>`

    <div class="mail ${mail.unread ? "unread":""}"
         onclick="openMail(${mail.id})">

      <div class="mail-sender">
        ${escapeHtml(mail.sender)}
      </div>

      <div class="mail-subject">
        ${escapeHtml(mail.subject)}
      </div>

      <div class="mail-date">
        ${escapeHtml(mail.date)}
      </div>

    </div>

  `).join("");
}


function changeFolder(folder,button){

  currentFolder=folder;

  document
    .querySelectorAll(".menu button")
    .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  renderMails();
}


function openCompose(){

  document.getElementById("composeModal").style.display="flex";

  document.getElementById("toInput").focus();
}


function closeCompose(){

  document.getElementById("composeModal").style.display="none";

  document.getElementById("toInput").value="";
  document.getElementById("subjectInput").value="";
  document.getElementById("bodyInput").value="";
}


function sendMail(){

  const to=document.getElementById("toInput").value.trim();
  const subject=document.getElementById("subjectInput").value.trim();
  const body=document.getElementById("bodyInput").value.trim();

  if(!to){
    alert("받는 사람을 입력하세요.");
    return;
  }

  if(!subject){
    alert("제목을 입력하세요.");
    return;
  }

  mails.unshift({
    id:Date.now(),
    folder:"sent",
    sender:"cucu@osmail.local",
    to:to,
    subject:subject,
    body:body,
    date:new Date().toLocaleDateString(),
    unread:false
  });

  save();

  closeCompose();

  alert("메일이 저장되었습니다.");

  currentFolder="sent";
  renderMails();
}


function openMail(id){

  const mail=mails.find(m=>m.id===id);

  if(!mail) return;

  mail.unread=false;

  save();

  document.getElementById("readSubject").textContent=
    mail.subject;

  document.getElementById("readSender").textContent=
    mail.folder==="sent"
      ? "받는 사람: "+mail.to
      : "보낸 사람: "+mail.sender;

  document.getElementById("readBody").textContent=
    mail.body;

  document.getElementById("readModal").style.display="flex";

  renderMails();
}


function closeRead(){
  document.getElementById("readModal").style.display="none";
}


function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


renderMails();

</script>

</body>
</html>
