<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자유게시판</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#f7f9f6;
    color:#17251b;
    font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;
}

body{
    min-height:100vh;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.header{
    background:#ffffff;
    border-bottom:1px solid #dfe7df;
    position:sticky;
    top:0;
    z-index:20;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    height:72px;
    padding:0 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:21px;
    font-weight:800;
    color:#17251b;
    text-decoration:none;
}

.logo span{
    color:#69a83f;
}

.header-right{
    display:flex;
    gap:8px;
}

.header-btn{
    border:1px solid #d7dfd7;
    background:#fff;
    color:#334238;
    padding:9px 14px;
    border-radius:7px;
    text-decoration:none;
    font-size:14px;
}

.header-btn:hover{
    background:#f3f7f2;
}

.main{
    max-width:1100px;
    margin:0 auto;
    padding:48px 22px 80px;
}

.page-title{
    margin-bottom:28px;
}

.page-title h1{
    margin:0;
    font-size:34px;
    letter-spacing:-1.5px;
}

.page-title p{
    margin:9px 0 0;
    color:#68746b;
    font-size:14px;
}

.board{
    background:#fff;
    border:1px solid #dfe7df;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(23,37,27,.04);
}

.board-top{
    padding:18px 20px;
    border-bottom:1px solid #e5ebe5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.total{
    font-size:14px;
    color:#59665d;
}

.total strong{
    color:#17251b;
}

.write-btn{
    border:0;
    background:#17251b;
    color:#fff;
    padding:10px 17px;
    border-radius:7px;
    font-weight:600;
}

.write-btn:hover{
    background:#2a3c2e;
}

.board-head{
    display:grid;
    grid-template-columns:80px 1fr 120px 110px 70px;
    padding:13px 20px;
    background:#f7f9f6;
    border-bottom:1px solid #e5ebe5;
    color:#68746b;
    font-size:13px;
    text-align:center;
}

.board-head div:nth-child(2){
    text-align:left;
}

.post-list{
    min-height:300px;
}

.post-row{
    display:grid;
    grid-template-columns:80px 1fr 120px 110px 70px;
    align-items:center;
    min-height:62px;
    padding:0 20px;
    border-bottom:1px solid #edf1ed;
    font-size:14px;
}

.post-row:hover{
    background:#fafcf9;
}

.post-number{
    text-align:center;
    color:#8a948c;
}

.post-title{
    min-width:0;
    color:#17251b;
    text-decoration:none;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.post-title:hover{
    color:#69a83f;
}

.post-author,
.post-date,
.post-views{
    text-align:center;
    color:#69746d;
    font-size:13px;
}

.notice{
    background:#fbfdf9;
}

.notice .post-number{
    color:#69a83f;
    font-weight:700;
}

.notice .post-title{
    font-weight:700;
}

.empty{
    padding:90px 20px;
    text-align:center;
    color:#89928b;
    font-size:14px;
}

.search-area{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-top:22px;
}

.search-select,
.search-input,
.search-btn{
    height:40px;
    border:1px solid #d8e0d8;
    background:#fff;
    border-radius:6px;
}

.search-select{
    padding:0 10px;
}

.search-input{
    width:300px;
    padding:0 12px;
    outline:none;
}

.search-input:focus{
    border-color:#69a83f;
}

.search-btn{
    padding:0 16px;
    background:#fff;
    cursor:pointer;
}

.search-btn:hover{
    background:#f2f6f1;
}

.pagination{
    display:flex;
    justify-content:center;
    gap:5px;
    margin-top:25px;
}

.page-btn{
    width:34px;
    height:34px;
    border:1px solid #dbe3db;
    background:#fff;
    border-radius:5px;
    color:#58645b;
}

.page-btn.active{
    background:#17251b;
    color:#fff;
    border-color:#17251b;
}

.modal-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,18,12,.48);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:720px;
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.modal-header{
    padding:20px 22px;
    border-bottom:1px solid #e5ebe5;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    margin:0;
    font-size:19px;
}

.close-btn{
    border:0;
    background:none;
    font-size:24px;
    color:#788178;
    cursor:pointer;
}

.modal-body{
    padding:22px;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:700;
}

.form-input,
.form-textarea{
    width:100%;
    border:1px solid #d8e0d8;
    border-radius:7px;
    outline:none;
    padding:11px 12px;
}

.form-input:focus,
.form-textarea:focus{
    border-color:#69a83f;
}

.form-textarea{
    min-height:250px;
    resize:vertical;
    line-height:1.7;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
}

.cancel-btn,
.submit-btn{
    padding:10px 18px;
    border-radius:7px;
    cursor:pointer;
}

.cancel-btn{
    border:1px solid #d8e0d8;
    background:#fff;
}

.submit-btn{
    border:0;
    background:#17251b;
    color:#fff;
}

.detail-title{
    font-size:25px;
    line-height:1.4;
    margin:0 0 13px;
}

.detail-meta{
    color:#7a847c;
    font-size:13px;
    padding-bottom:18px;
    border-bottom:1px solid #e5ebe5;
}

.detail-content{
    min-height:220px;
    padding:25px 0;
    white-space:pre-wrap;
    line-height:1.8;
    font-size:15px;
}

.detail-actions{
    display:flex;
    justify-content:space-between;
    border-top:1px solid #e5ebe5;
    padding-top:16px;
}

.action-left,
.action-right{
    display:flex;
    gap:7px;
}

.small-btn{
    border:1px solid #d8e0d8;
    background:#fff;
    padding:8px 13px;
    border-radius:6px;
}

.small-btn:hover{
    background:#f5f8f4;
}

.delete-btn{
    color:#b33b3b;
}

.comments{
    margin-top:28px;
    border-top:1px solid #e5ebe5;
    padding-top:22px;
}

.comments h3{
    font-size:16px;
    margin:0 0 15px;
}

.comment{
    padding:14px 0;
    border-bottom:1px solid #edf1ed;
}

.comment-meta{
    font-size:12px;
    color:#7c857e;
    margin-bottom:7px;
}

.comment-content{
    white-space:pre-wrap;
    font-size:14px;
    line-height:1.6;
}

.comment-form{
    margin-top:18px;
    display:flex;
    gap:7px;
}

.comment-input{
    flex:1;
    border:1px solid #d8e0d8;
    border-radius:6px;
    padding:10px;
    outline:none;
}

.comment-submit{
    border:0;
    background:#17251b;
    color:#fff;
    padding:0 16px;
    border-radius:6px;
}

.footer{
    text-align:center;
    color:#8a938c;
    font-size:12px;
    padding:0 20px 35px;
}

@media(max-width:700px){

    .header-inner{
        height:62px;
    }

    .main{
        padding:30px 12px 60px;
    }

    .page-title h1{
        font-size:27px;
    }

    .board-head{
        display:none;
    }

    .post-row{
        grid-template-columns:42px 1fr;
        padding:13px 14px;
        min-height:70px;
    }

    .post-number{
        grid-row:span 2;
    }

    .post-author,
    .post-date,
    .post-views{
        display:inline;
        text-align:left;
        font-size:11px;
    }

    .post-author:after{
        content:" · ";
    }

    .post-date:after{
        content:" · ";
    }

    .post-row:not(.notice){
        position:relative;
    }

    .post-row:not(.notice) .post-views{
        position:absolute;
        right:14px;
        bottom:13px;
    }

    .notice .post-views{
        display:none;
    }

    .search-area{
        flex-wrap:wrap;
    }

    .search-input{
        width:calc(100% - 90px);
    }

    .search-select{
        width:80px;
    }

    .search-btn{
        width:100%;
    }

    .modal{
        max-height:94vh;
    }

    .modal-body{
        padding:17px;
    }

    .detail-title{
        font-size:21px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <a href="index.html" class="logo">
            <span>FHPT</span> 자유게시판
        </a>

        <div class="header-right">
            <a href="index.html" class="header-btn">홈</a>
        </div>
    </div>
</header>

<main class="main">

    <div class="page-title">
        <h1>자유게시판</h1>
        <p>자유롭게 이야기를 나눌 수 있는 공간입니다.</p>
    </div>

    <section class="board">

        <div class="board-top">
            <div class="total">
                전체 게시글 <strong id="totalCount">0</strong>
            </div>

            <button class="write-btn" onclick="openWriteModal()">
                글쓰기
            </button>
        </div>

        <div class="board-head">
            <div>번호</div>
            <div>제목</div>
            <div>작성자</div>
            <div>작성일</div>
            <div>조회</div>
        </div>

        <div id="postList" class="post-list"></div>

    </section>

    <div class="search-area">
        <select id="searchType" class="search-select">
            <option value="title">제목</option>
            <option value="author">작성자</option>
            <option value="content">내용</option>
        </select>

        <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="검색어를 입력하세요"
            onkeydown="if(event.key==='Enter') searchPosts()"
        >

        <button class="search-btn" onclick="searchPosts()">검색</button>
    </div>

    <div id="pagination" class="pagination"></div>

</main>

<footer class="footer">
    자유게시판
</footer>


<!-- 글쓰기 모달 -->
<div id="writeModal" class="modal-bg">
    <div class="modal">

        <div class="modal-header">
            <h2>글쓰기</h2>
            <button class="close-btn" onclick="closeWriteModal()">×</button>
        </div>

        <div class="modal-body">

            <div class="form-group">
                <label for="writeAuthor">작성자</label>
                <input
                    id="writeAuthor"
                    class="form-input"
                    maxlength="20"
                    placeholder="이름을 입력하세요"
                >
            </div>

            <div class="form-group">
                <label for="writePassword">비밀번호</label>
                <input
                    id="writePassword"
                    class="form-input"
                    type="password"
                    maxlength="30"
                    placeholder="게시글 수정 및 삭제에 사용됩니다"
                >
            </div>

            <div class="form-group">
                <label for="writeTitle">제목</label>
                <input
                    id="writeTitle"
                    class="form-input"
                    maxlength="100"
                    placeholder="제목을 입력하세요"
                >
            </div>

            <div class="form-group">
                <label for="writeContent">내용</label>
                <textarea
                    id="writeContent"
                    class="form-textarea"
                    maxlength="5000"
                    placeholder="내용을 입력하세요"
                ></textarea>
            </div>

            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeWriteModal()">
                    취소
                </button>

                <button class="submit-btn" onclick="createPost()">
                    등록
                </button>
            </div>

        </div>
    </div>
</div>


<!-- 게시글 상세 모달 -->
<div id="detailModal" class="modal-bg">
    <div class="modal">

        <div class="modal-header">
            <h2>게시글</h2>
            <button class="close-btn" onclick="closeDetailModal()">×</button>
        </div>

        <div class="modal-body">

            <h2 id="detailTitle" class="detail-title"></h2>

            <div id="detailMeta" class="detail-meta"></div>

            <div id="detailContent" class="detail-content"></div>

            <div class="detail-actions">

                <div class="action-left">
                    <button class="small-btn" onclick="closeDetailModal()">
                        목록
                    </button>
                </div>

                <div class="action-right">
                    <button class="small-btn" onclick="editCurrentPost()">
                        수정
                    </button>

                    <button class="small-btn delete-btn" onclick="deleteCurrentPost()">
                        삭제
                    </button>
                </div>

            </div>

            <div class="comments">

                <h3>
                    댓글 <span id="commentCount">0</span>
                </h3>

                <div id="commentList"></div>

                <div class="comment-form">
                    <input
                        id="commentInput"
                        class="comment-input"
                        maxlength="500"
                        placeholder="댓글을 입력하세요"
                    >

                    <button
                        class="comment-submit"
                        onclick="addComment()"
                    >
                        등록
                    </button>
                </div>

            </div>

        </div>
    </div>
</div>


<script>

/* =========================
   기본 설정
========================= */

const STORAGE_KEY = "fhpt_free_board_v1";

let posts = [];
let currentPostId = null;

const POSTS_PER_PAGE = 10;
let currentPage = 1;
let currentSearch = "";
let currentSearchType = "title";


/* =========================
   초기 데이터
========================= */

function loadPosts(){

    try{
        const saved = localStorage.getItem(STORAGE_KEY);

        if(saved){
            posts = JSON.parse(saved);
        }else{
            posts = [
                {
                    id: Date.now(),
                    author:"관리자",
                    password:"admin",
                    title:"자유게시판에 오신 것을 환영합니다.",
                    content:"자유게시판입니다.\n\n서로를 존중하면서 자유롭게 이야기를 나누어 주세요.",
                    date:formatDate(new Date()),
                    views:0,
                    notice:true,
                    comments:[]
                }
            ];

            savePosts();
        }

    }catch(error){

        console.error(error);

        posts = [];
    }

    renderPosts();
}


/* =========================
   저장
========================= */

function savePosts(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(posts)
    );
}


/* =========================
   날짜
========================= */

function formatDate(date){

    const y = date.getFullYear();
    const m = String(date.getMonth()+1).padStart(2,"0");
    const d = String(date.getDate()).padStart(2,"0");

    return `${y}.${m}.${d}`;
}


/* =========================
   HTML 보안 처리
========================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   게시글 렌더링
========================= */

function renderPosts(){

    const list = document.getElementById("postList");

    let filtered = [...posts];

    if(currentSearch.trim()){

        const keyword = currentSearch.trim().toLowerCase();

        filtered = filtered.filter(post => {

            const target =
                currentSearchType === "title"
                ? post.title
                : currentSearchType === "author"
                ? post.author
                : post.content;

            return target.toLowerCase().includes(keyword);
        });
    }

    filtered.sort((a,b) => {

        if(a.notice && !b.notice) return -1;
        if(!a.notice && b.notice) return 1;

        return b.id - a.id;
    });

    document.getElementById("totalCount").textContent = filtered.length;

    const start =
        (currentPage - 1) * POSTS_PER_PAGE;

    const pagePosts =
        filtered.slice(start,start + POSTS_PER_PAGE);

    if(pagePosts.length === 0){

        list.innerHTML = `
            <div class="empty">
                등록된 게시글이 없습니다.
            </div>
        `;

        renderPagination(filtered.length);

        return;
    }

    list.innerHTML = pagePosts.map((post,index) => {

        const number =
            filtered.length - start - index;

        return `
            <div class="post-row ${post.notice ? "notice" : ""}">

                <div class="post-number">
                    ${post.notice ? "공지" : number}
                </div>

                <div
                    class="post-title"
                    onclick="openPost(${post.id})"
                    title="${escapeHTML(post.title)}"
                >
                    ${escapeHTML(post.title)}
                    ${
                        post.comments && post.comments.length
                        ? ` <span style="color:#69a83f">[${post.comments.length}]</span>`
                        : ""
                    }
                </div>

                <div class="post-author">
                    ${escapeHTML(post.author)}
                </div>

                <div class="post-date">
                    ${escapeHTML(post.date)}
                </div>

                <div class="post-views">
                    ${post.views || 0}
                </div>

            </div>
        `;

    }).join("");

    renderPagination(filtered.length);
}


/* =========================
   페이지네이션
========================= */

function renderPagination(total){

    const pagination =
        document.getElementById("pagination");

    const totalPages =
        Math.ceil(total / POSTS_PER_PAGE);

    if(totalPages <= 1){

        pagination.innerHTML = "";

        return;
    }

    let html = "";

    for(let i=1;i<=totalPages;i++){

        html += `
            <button
                class="page-btn ${i === currentPage ? "active" : ""}"
                onclick="goPage(${i})"
            >
                ${i}
            </button>
        `;
    }

    pagination.innerHTML = html;
}


function goPage(page){

    currentPage = page;

    renderPosts();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================
   검색
========================= */

function searchPosts(){

    currentSearchType =
        document.getElementById("searchType").value;

    currentSearch =
        document.getElementById("searchInput").value;

    currentPage = 1;

    renderPosts();
}


/* =========================
   글쓰기
========================= */

function openWriteModal(){

    document.getElementById("writeAuthor").value = "";
    document.getElementById("writePassword").value = "";
    document.getElementById("writeTitle").value = "";
    document.getElementById("writeContent").value = "";

    document
        .getElementById("writeModal")
        .classList.add("show");
}


function closeWriteModal(){

    document
        .getElementById("writeModal")
        .classList.remove("show");
}


function createPost(){

    const author =
        document.getElementById("writeAuthor").value.trim();

    const password =
        document.getElementById("writePassword").value;

    const title =
        document.getElementById("writeTitle").value.trim();

    const content =
        document.getElementById("writeContent").value.trim();

    if(!author){

        alert("작성자를 입력해 주세요.");

        return;
    }

    if(!password){

        alert("비밀번호를 입력해 주세요.");

        return;
    }

    if(!title){

        alert("제목을 입력해 주세요.");

        return;
    }

    if(!content){

        alert("내용을 입력해 주세요.");

        return;
    }

    const post = {

        id:Date.now(),

        author:author,

        password:password,

        title:title,

        content:content,

        date:formatDate(new Date()),

        views:0,

        notice:false,

        comments:[]
    };

    posts.unshift(post);

    savePosts();

    closeWriteModal();

    currentSearch = "";
    document.getElementById("searchInput").value = "";

    currentPage = 1;

    renderPosts();

    alert("게시글이 등록되었습니다.");
}


/* =========================
   게시글 보기
========================= */

function openPost(id){

    const post =
        posts.find(p => p.id === id);

    if(!post) return;

    post.views =
        (post.views || 0) + 1;

    savePosts();

    currentPostId = id;

    document.getElementById("detailTitle").textContent =
        post.title;

    document.getElementById("detailMeta").textContent =
        `${post.author} · ${post.date} · 조회 ${post.views}`;

    document.getElementById("detailContent").textContent =
        post.content;

    renderComments(post);

    document
        .getElementById("detailModal")
        .classList.add("show");

    renderPosts();
}


function closeDetailModal(){

    document
        .getElementById("detailModal")
        .classList.remove("show");

    currentPostId = null;
}


/* =========================
   댓글
========================= */

function renderComments(post){

    const list =
        document.getElementById("commentList");

    const count =
        document.getElementById("commentCount");

    count.textContent =
        post.comments ? post.comments.length : 0;

    if(!post.comments || post.comments.length === 0){

        list.innerHTML = `
            <div style="color:#89928b;font-size:13px;padding:15px 0;">
                아직 댓글이 없습니다.
            </div>
        `;

        return;
    }

    list.innerHTML =
        post.comments.map(comment => {

            return `
                <div class="comment">

                    <div class="comment-meta">
                        ${escapeHTML(comment.author)}
                        ·
                        ${escapeHTML(comment.date)}
                    </div>

                    <div class="comment-content">
                        ${escapeHTML(comment.content)}
                    </div>

                </div>
            `;

        }).join("");
}


function addComment(){

    const input =
        document.getElementById("commentInput");

    const content =
        input.value.trim();

    if(!content){

        alert("댓글 내용을 입력해 주세요.");

        return;
    }

    const post =
        posts.find(p => p.id === currentPostId);

    if(!post) return;

    if(!post.comments){
        post.comments = [];
    }

    post.comments.push({

        id:Date.now(),

        author:"익명",

        content:content,

        date:formatDate(new Date())
    });

    input.value = "";

    savePosts();

    renderComments(post);

    renderPosts();
}


/* =========================
   게시글 삭제
========================= */

function deleteCurrentPost(){

    const post =
        posts.find(p => p.id === currentPostId);

    if(!post) return;

    const password =
        prompt("게시글 비밀번호를 입력하세요.");

    if(password === null) return;

    if(password !== post.password){

        alert("비밀번호가 올바르지 않습니다.");

        return;
    }

    if(!confirm("정말 게시글을 삭제하시겠습니까?")){

        return;
    }

    posts =
        posts.filter(p => p.id !== currentPostId);

    savePosts();

    closeDetailModal();

    renderPosts();
}


/* =========================
   게시글 수정
========================= */

function editCurrentPost(){

    const post =
        posts.find(p => p.id === currentPostId);

    if(!post) return;

    const password =
        prompt("게시글 비밀번호를 입력하세요.");

    if(password === null) return;

    if(password !== post.password){

        alert("비밀번호가 올바르지 않습니다.");

        return;
    }

    const newTitle =
        prompt("제목을 수정하세요.",post.title);

    if(newTitle === null) return;

    const newContent =
        prompt("내용을 수정하세요.",post.content);

    if(newContent === null) return;

    if(!newTitle.trim() || !newContent.trim()){

        alert("제목과 내용을 모두 입력해 주세요.");

        return;
    }

    post.title =
        newTitle.trim();

    post.content =
        newContent.trim();

    savePosts();

    document.getElementById("detailTitle").textContent =
        post.title;

    document.getElementById("detailContent").textContent =
        post.content;

    renderPosts();

    alert("게시글이 수정되었습니다.");
}


/* =========================
   모달 바깥 클릭
========================= */

document.querySelectorAll(".modal-bg")
.forEach(modal => {

    modal.addEventListener("click",function(e){

        if(e.target === modal){

            modal.classList.remove("show");
        }

    });

});


/* =========================
   ESC로 닫기
========================= */

document.addEventListener("keydown",function(e){

    if(e.key === "Escape"){

        document
            .querySelectorAll(".modal-bg")
            .forEach(modal => {
                modal.classList.remove("show");
            });
    }

});


/* =========================
   시작
========================= */

loadPosts();
