/* =========================================================
   키보드
========================================================= */

document.addEventListener("keydown",e=>{

  const code=e.code;

  if(
    code==="ArrowLeft" ||
    code==="ArrowRight" ||
    code==="KeyA" ||
    code==="KeyD"
  ){

    shooting=false;

  }

  if(code==="ArrowLeft"){
    keys.arrowleft=true;
  }

  if(code==="ArrowRight"){
    keys.arrowright=true;
  }

  if(code==="KeyA"){
    keys.a=true;
  }

  if(code==="KeyD"){
    keys.d=true;
  }

  if([
    "ArrowLeft",
    "ArrowRight",
    "Space",
    "KeyA",
    "KeyD",
    "KeyQ",
    "KeyE"
  ].includes(code)){

    e.preventDefault();

  }

  if(code==="Space"){
    shooting=true;
  }

  if(running && !e.repeat){

    if(code==="Space"){
      shoot();
    }

    else if(code==="KeyQ"){
      activateShield();
    }

    else if(code==="KeyE"){
      activateFreeze();
    }

  }

});


document.addEventListener("keyup",e=>{

  if(e.code==="Space"){
    shooting=false;
  }

  if(e.code==="ArrowLeft"){
    keys.arrowleft=false;
  }

  if(e.code==="ArrowRight"){
    keys.arrowright=false;
  }

  if(e.code==="KeyA"){
    keys.a=false;
  }

  if(e.code==="KeyD"){
    keys.d=false;
  }

});

    if(!name || !name.trim()){

      );

      return;

    }

    playerName=
      name.trim().slice(0,12);

    localStorage.setItem(
      "meteorSurvivorPlayerName",
      playerName
    );

  }

  stage=1;
  score=0;

  shield=false;
  freeze=false;
  laser=true;

  startStage();

}

/* =========================================================

/* =========================================================
   운석 생성
   1~10 스테이지 특수 운석 등장 순서

   1 : 일반
   2 : 빠른 추가
   3 : 3회 피격 추가
   4 : 보너스 추가
   5 : 변화 없음 + 보스
   6 : 폭발 추가
   7 : 변화 없음
   8 : 분열 추가
   9 : 변화 없음
   10: 변화 없음 + 보스

   11부터:
   기존 특수 운석 시스템 사용
========================================================= */

function spawnRock(){

  const s=stages[stage-1];

  const roll=Math.random();

  let type=0;


  /* =========================================
     1~10 스테이지
  ========================================= */

  if(stage===1){

    /* 일반만 */
    type=0;

  }

  else if(stage===2){

    /* 일반 + 빠른 */
    if(roll<0.25){
      type=1;
    }else{
      type=0;
    }

  }

  else if(stage===3){

    /* 일반 + 빠른 + 3회 피격 */
    if(roll<0.20){
      type=2;
    }else if(roll<0.45){
      type=1;
    }else{
      type=0;
    }

  }

  else if(stage===4 || stage===5){

    /* 일반 + 빠른 + 3회 피격 + 보너스 */
    if(roll<0.15){
      type=3;
    }else if(roll<0.35){
      type=2;
    }else if(roll<0.60){
      type=1;
    }else{
      type=0;
    }

  }

  else if(stage===6 || stage===7){

    /* 일반 + 빠른 + 3회 피격 + 보너스 + 폭발 */
    if(roll<0.15){
      type=4;
    }else if(roll<0.28){
      type=3;
    }else if(roll<0.45){
      type=2;
    }else if(roll<0.65){
      type=1;
    }else{
      type=0;
    }

  }

  else if(stage>=8 && stage<=10){

    /*
      일반
      + 빠른
      + 3회 피격
      + 보너스
      + 폭발
      + 분열
    */

    if(roll<0.14){
      type=5;
    }else if(roll<0.27){
      type=4;
    }else if(roll<0.40){
      type=3;
    }else if(roll<0.57){
      type=2;
    }else if(roll<0.75){
      type=1;
    }else{
      type=0;
    }

  }


  /* =========================================
     11스테이지 이후
     기존 시스템 그대로
  ========================================= */

  else{

    if(roll<0.10){

      type=9;

    }else if(roll<0.20){

      type=8;

    }else if(roll<0.32){

      type=7;

    }else if(roll<0.45){

      type=6;

    }else if(roll<0.58){

      type=5;

    }else if(roll<0.72){

      type=4;

    }else if(roll<0.80){

      type=3;

    }else if(roll<0.90){

      type=2;

    }else if(roll<0.97){

      type=1;

    }else{

      type=0;

    }

  }


  /* =========================================
     운석 크기 / 속도 / HP
  ========================================= */

  let size=20+Math.random()*35;

  let speed=
    s.speed+
    Math.random()*120+
    stage*8;

  let hp=1;


  /* 빠른 운석 */

  if(type===1){

    size=16+Math.random()*15;

    speed*=1.8;

  }


  /* 3회 피격 운석 */

  if(type===2){

    size=35+Math.random()*15;

    speed*=.75;

    hp=3;

  }


  /* 보너스 운석 */

  if(type===3){

    size=25+Math.random()*20;

    speed*=.9;

  }


  /* 폭발 운석 */

  if(type===4){

    size=28+Math.random()*18;

    speed*=.85;

  }


  /* 분열 운석 */

  if(type===5){

    size=30+Math.random()*18;

    speed*=.8;

  }


  /* 추적 운석 */

  if(type===6){

    size=22+Math.random()*16;

    speed*=1.18;

  }


  /* 지그재그 운석 */

  if(type===7){

    size=22+Math.random()*16;

    speed*=1.08;

  }


  /* 강화 중장 */

  if(type===8){

    size=38+Math.random()*18;

    speed*=.88;

    hp=6;

  }


  /* 초분열 */

  if(type===9){

    size=34+Math.random()*18;

    speed*=.95;

    hp=2;

  }


  rocks.push({

    x:
      Math.random()*
      (canvas.width-size),

    y:-size,

    w:size,

    h:size,

    speed:speed,

    rot:Math.random()*6,

    type:type,

    hp:hp

  });

}

/* =========================================================

========================================================= */

function hit(a,b){

  return(

    a.x<b.x+b.w &&
    a.x+a.w>b.x &&
    a.y<b.y+b.h &&
    a.y+a.h>b.y

  );

}

function renderSkins(){ 

  document.getElementById("coinDisplay").textContent = 
    `💰 보유 코인: ${coins.toLocaleString()}`; 

  const list = document.getElementById("skinList"); 

  if(!list){ 
    return; 
  } 

  list.innerHTML = "";


  Object.entries(skinData).forEach(
    ([id,s])=>{

      const owned=
        ownedSkins.includes(id);

      const equipped=
        playerSkin===id;


      const b=
        document.createElement("button");

      b.className="skin-card";

      b.style.background=
        equipped
        ? "#164a8a"
        : "rgba(255,255,255,.08)";


      b.innerHTML=

  `
    <div style="
      font-size:32px;
      margin-bottom:5px;
      ${
        id==="nebula"
        ? "color:#b77cff;text-shadow:0 0 15px #8d5cff;"
        :id==="emperor"
        ? "color:#ffd84a;text-shadow:0 0 18px #ffd84a;"
        : ""
      }
    ">
      ${getSkinIcon(id)}
    </div>

    <b>${s.name}</b>

    <br>

    <span style="
      font-size:13px;
      opacity:.85;
    ">
      ${
        s.price===0
        ? "무료"
        : "🪙 "+s.price.toLocaleString()+" 코인"
      }
    </span>

    <br>

    <span style="
      display:inline-block;
      margin-top:5px;
      font-size:12px;
      color:${
        equipped
        ? "#55f5ff"
        :owned
        ? "#8cff9a"
        :"#ddd"
      };
    ">
      ${
        equipped
        ? "★ 장착 중"
        :owned
        ? "장착하기"
        : "구매하기"
      }
    </span>
  `;


      b.onclick=()=>{

        /* 이미 보유한 스킨 */

        if(owned){

          playerSkin=id;

          saveSkinData();

          renderSkins();

          return;

        }


        /* 구매 */

        if(coins<s.price){

          alert("코인이 부족해!");

          return;

        }

        coins-=s.price;

        ownedSkins.push(id);

        playerSkin=id;

        save();

        saveSkinData();

        renderSkins();

      };


      list.appendChild(b);

    }

  );

}

async function openRanking(){

  const modal=
    document.getElementById(
      "rankingModal"
    );

  const list=
    document.getElementById(
      "rankingList"
    );

  modal.style.display="flex";

  list.innerHTML=
    `
      <p style="text-align:center;">
        순위를 불러오는 중...
      </p>
    `;


  const {data,error}=
    await supabaseClient

      .from("ranking")

      .select(
        "name,stage,score,time"
      )

      .order(
        "stage",
        {ascending:false}
      )

      .order(
        "score",
        {ascending:false}
      )

      .order(
        "time",
        {ascending:false}
      )

      .limit(100);


  if(error){

    console.error(
      "순위 불러오기 실패:",
      error
    );

    list.innerHTML=
      `
        <p style="
          text-align:center;
          color:#ff6677;
        ">
          순위를 불러오지 못했습니다.
        </p>
      `;

    return;

  }


  if(!data || data.length===0){

    list.innerHTML=
      `
        <p style="
          text-align:center;
          opacity:.75;
        ">
          아직 등록된 기록이 없습니다.
        </p>
      `;

    return;

  }


  /* 같은 닉네임은 최고 기록 하나만 */

  const bestByName={};


  data.forEach(r=>{

    if(!bestByName[r.name]){

      bestByName[r.name]=r;

      return;

    }


    const best=
      bestByName[r.name];


    if(

      r.stage>best.stage ||

      (

        r.stage===best.stage &&
        r.score>best.score

      ) ||

      (

        r.stage===best.stage &&
        r.score===best.score &&
        r.time>best.time

      )

    ){

      bestByName[r.name]=r;

    }

  });


  const bestData=
    Object.values(bestByName)

      .sort((a,b)=>

        b.stage-a.stage ||

        b.score-a.score ||

        b.time-a.time

      )

      .slice(0,20);


  list.innerHTML=
    bestData.map((r,i)=>{

      const medal=

        i===0
        ? "🥇"

        :i===1
        ? "🥈"

        :i===2
        ? "🥉"

        :(i+1)+"위";


      const safeName=
        String(
          r.name||"PLAYER"
        ).replace(
          /[&<>]/g,
          ""
        );


      return`

        <div style="
          display:flex;
          align-items:center;
          gap:8px;
          padding:10px 5px;
          border-bottom:1px solid #27305b;
        ">

          <b style="
            width:40px;
            text-align:center;
          ">
            ${medal}
          </b>

          <span style="
            flex:1;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
          ">
            ${safeName}
          </span>

          <span>
            STAGE ${Number(r.stage)}
          </span>

          <span style="
            width:70px;
            text-align:right;
          ">
            ${Number(r.score)}점
          </span>

        </div>

      `;

    }).join("");

}

/* =========================================================
   업데이트
========================================================= */

function update(dt){

  if(!running){
    return;
  }


  /* 자동 연사 */

  shootCooldown-=dt;


  if(
    shooting &&
    shootCooldown<=0
  ){

    shoot();

    shootCooldown=.12;

  }


  const s=
    stages[stage-1];


  /* 플레이어 */

  if(
    keys["arrowleft"] ||
    keys["a"] ||
    touchLeft
  ){

    player.x-=
      player.speed*dt;

  }


  if(
    keys["arrowright"] ||
    keys["d"] ||
    touchRight
  ){

    player.x+=
      player.speed*dt;

  }


  player.x=
    Math.max(
      0,
      Math.min(
        canvas.width-player.w,
        player.x
      )
    );


  /* 시간 */

  stageTime+=dt;


  /* 운석 생성 */

  spawnTime+=dt;


  if(
    spawnTime>=s.spawn &&
    !boss
  ){

    spawnTime=0;

    spawnRock();


    if(
      stage>=11
        ? Math.random()<.48
        : stage>=3 &&
          Math.random()<.3
    ){

      spawnRock();

    }

  }


  /* 보스 등장 */

  if(
    s.boss &&
    stageTime>=5 &&
    !boss
  ){

    spawnBoss();


    info.innerHTML=
      `
        ⚠️ <b>STAGE ${stage} BOSS 등장!</b>
        <br><br>
        ${s.name}
      `;

  }


  const slow=
    freeze ? .3 : 1;


  /* =====================================================
     운석
  ===================================================== */

  for(
    let i=rocks.length-1;
    i>=0;
    i--
  ){

    const r=rocks[i];


    r.y+=
      r.speed*dt*slow;

    r.rot+=
      dt*2;


    /* 일반 운석 좌우 흔들림 */

    if(
      stage>=6 &&
      r.type===0
    ){

      r.x+=
        Math.sin(r.y*.05)*1.5;

    }


    /* 고속 */

    if(r.type===1){

      r.x+=
        Math.sin(r.y*.05)*1.5;

    }


    /* 분열 */

    if(r.type===5){

      r.x+=
        Math.sin(r.y*.035)*2.5;

    }


    /* 추적 */

    if(r.type===6){

      const targetX=
        player.x+
        player.w/2;

      const rockX=
        r.x+
        r.w/2;

      const steer=
        targetX>rockX
        ? 1
        : -1;

      r.x+=
        steer*
        Math.min(
          95,
          38+stage*2
        )*
        dt;

    }


    /* 지그재그 */

    if(r.type===7){

      r.x+=
        Math.sin(
          r.y*.055+r.rot
        )*
        (3.5+stage*.12);

    }


    /* 강화 중장 */

    if(r.type===8){

      r.x+=
        Math.sin(r.y*.025)*1.2;

    }


    /* 초분열 */

    if(r.type===9){

      r.x+=
        Math.sin(
          r.y*.04+r.rot*2
        )*2.2;

    }


    /* 플레이어 충돌 */

    if(hit(player,r)){

      if(shield){

        shield=false;

        explode(
          r.x+r.w/2,
          r.y+r.h/2,
          "#55f5ff",
          25
        );

        rocks.splice(i,1);

        continue;

      }


      gameOver();

      return;

    }


    /* 화면 밖 */

    if(
      r.y>
      canvas.height+50
    ){

      rocks.splice(i,1);

      score++;

      coins++;

    }

  }


  /* =====================================================
     총알
  ===================================================== */

  for(
    let i=bullets.length-1;
    i>=0;
    i--
  ){

    const b=bullets[i];

    b.y-=
      b.speed*dt;

    let destroyed=false;


    /* 보스 공격 */

    if(
      boss &&
      hit(b,boss)
    ){

      boss.hp-=
        b.damage;

      explode(
        b.x,
        b.y,
        "#ffe45c",
        8
      );

      destroyed=true;


      /* 보스 처치 */

      if(boss.hp<=0){

        score+=150;

        coins+=80;


        const explosionX=
          boss.x+
          boss.w/2;

        const explosionY=
          boss.y+
          boss.h/2;


        explode(
          explosionX,
          explosionY,
          "#ff3180",
          100
        );

        explode(
          explosionX,
          explosionY,
          "#55f5ff",
          60
        );

        explode(
          explosionX,
          explosionY,
          "#ffe45c",
          40
        );


        boss=null;


        /* 최종 보스 */

        if(stage===30){

          stopMusic();


          setTimeout(()=>{

            gameClear();

          },1200);


        }


        /* 일반 보스 */

        else{

          setTimeout(()=>{

            if(
              running &&
              !boss
            ){

              nextStage();

            }

          },700);

        }

      }

    }


    /* =================================================
       운석 공격
    ================================================= */

    for(
      let j=rocks.length-1;
      j>=0 &&
      !destroyed;
      j--
    ){

      if(hit(b,rocks[j])){

        const r=rocks[j];


        r.hp--;


        if(r.hp>0){

          explode(
            r.x+r.w/2,
            r.y+r.h/2,
            "#ffffff",
            5
          );

          destroyed=true;

          continue;

        }


        /* 보너스 */

        if(r.type===3){

          score+=8;
          coins+=3;

          explode(
            r.x+r.w/2,
            r.y+r.h/2,
            "#55f5ff",
            20
          );

        }


        /* 폭발 */

        else if(r.type===4){

          score+=4;
          coins+=2;


          const cx=
            r.x+r.w/2;

          const cy=
            r.y+r.h/2;


          explode(
            cx,
            cy,
            "#ff7b00",
            30
          );


          for(
            let k=rocks.length-1;
            k>=0;
            k--
          ){

            if(k===j){
              continue;
            }


            const other=
              rocks[k];


            const dx=
              other.x+
              other.w/2-
              cx;

            const dy=
              other.y+
              other.h/2-
              cy;


            const distance=
              Math.sqrt(
                dx*dx+
                dy*dy
              );


            if(distance<90){

              rocks.splice(k,1);

              score+=2;

              coins++;

            }

          }

        }


        /* 분열 */

        else if(r.type===5){

          score+=5;
          coins+=2;


          const cx=
            r.x+r.w/2;

          const cy=
            r.y+r.h/2;


          explode(
            cx,
            cy,
            "#b84cff",
            25
          );


          for(
            let k=0;
            k<3;
            k++
          ){

            rocks.push({

              x:
                cx-10+
                Math.random()*20,

              y:cy,

              w:14,
              h:14,

              speed:
                300+
                Math.random()*100,

              rot:
                Math.random()*6,

              type:0,

              hp:1

            });

          }

        }


        /* 강화 중장 */

        else if(r.type===8){

          score+=8;
          coins+=4;


          explode(
            r.x+r.w/2,
            r.y+r.h/2,
            "#9fa8ff",
            20
          );

        }


        /* 초분열 */

        else if(r.type===9){

          score+=10;
          coins+=5;


          const cx=
            r.x+r.w/2;

          const cy=
            r.y+r.h/2;


          explode(
            cx,
            cy,
            "#ff66cc",
            28
          );


          for(
            let k=0;
            k<5;
            k++
          ){

            rocks.push({

              x:
                cx-8+
                Math.random()*16,

              y:cy,

              w:12,
              h:12,

              speed:
                360+
                stage*8+
                Math.random()*120,

              rot:
                Math.random()*6,

              type:1,

              hp:1

            });

          }

        }


        /* 일반 */

        else{

          score+=2;

          coins++;


          explode(

            r.x+r.w/2,

            r.y+r.h/2,

            r.type===1
              ? "#ffe45c"

              :r.type===6
              ? "#ff55ff"

              :r.type===7
              ? "#66e6ff"

              :"#ff465d",

            12

          );

        }


        rocks.splice(j,1);

        destroyed=true;

      }

    }


    if(
      destroyed ||
      b.y<-40
    ){

      bullets.splice(i,1);

    }

  }


  /* =====================================================
     보스
  ===================================================== */

  if(boss){

    boss.x+=
      boss.dir*
      boss.speed*
      dt;


    if(
      boss.x<0 ||
      boss.x+boss.w>
      canvas.width
    ){

      boss.dir*=-1;

    }


    boss.shot+=dt;


    if(boss.shot>=.9){

      boss.shot=0;


      for(
        let i=0;
        i<2;
        i++
      ){

        rocks.push({

          x:
            boss.x+
            Math.random()*boss.w,

          y:
            boss.y+
            boss.h,

          w:25,
          h:25,

          speed:
            250+
            stage*15,

          rot:0,

          type:0,

          hp:1

        });

      }

    }


    if(boss.y<65){

      boss.y+=
        55*dt;

    }

  }


  /* =====================================================
     스테이지 클리어
  ===================================================== */

  if(
    stageTime>=s.duration &&
    !boss &&
    !transitioning
  ){

    nextStage();

    return;

  }


  /* =====================================================
     파티클
  ===================================================== */

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=
      particles[i];


    p.x+=
      p.vx*dt;

    p.y+=
      p.vy*dt;

    p.vy+=
      80*dt;

    p.life-=dt;


    if(p.life<=0){

      particles.splice(i,1);

    }

  }

}


/* =========================================================
   폭발
========================================================= */

function explode(
  x,
  y,
  color,
  count=12
){

  for(
    let i=0;
    i<count;
    i++
  ){

    const angle=
      Math.random()*
      Math.PI*2;

    const speed=
      60+
      Math.random()*220;


    particles.push({

      x:x,
      y:y,

      vx:
        Math.cos(angle)*
        speed,

      vy:
        Math.sin(angle)*
        speed,

      life:
        .4+
        Math.random()*.8,

      color:color

    });

  }

}

    else if(r.type===2){

      for(

        }

      }

      ctx.closePath();

      ctx.fill();


      ctx.fillStyle="#fff";

      ctx.font=
        "bold 12px Arial";

      ctx.textAlign="center";

      ctx.fillText(
        r.hp,
        0,
        4
      );

    }


    /* 보너스 */

    else if(r.type===3){

      ctx.fillStyle="#55f5ff";

      ctx.shadowColor="#55f5ff";


      ctx.beginPath();

      ctx.moveTo(
        0,
        -r.h/2
      );

      ctx.lineTo(
        r.w/2,
        0
      );

      ctx.lineTo(
        0,
        r.h/2
      );

      ctx.lineTo(
        -r.w/2,
        0
      );

      ctx.closePath();

      ctx.fill();

    }


    /* 폭발 */

    else if(r.type===4){

      ctx.fillStyle="#ff7b00";

      ctx.shadowColor="#ff4d00";


      ctx.beginPath();

      for(
        let i=0;
        i<10;
        i++
      ){

        const a=
          Math.PI*2*i/10;

        const radius=
          i%2===0
          ? r.w/2
          : r.w/3;


        const x=
          Math.cos(a)*radius;

        const y=
          Math.sin(a)*radius;


        if(i===0){
          ctx.moveTo(x,y);
        }else{
          ctx.lineTo(x,y);
        }

      }

      ctx.closePath();

      ctx.fill();

    }


    /* 분열 */

    else if(r.type===5){

      ctx.fillStyle="#b84cff";

      ctx.shadowColor="#b84cff";


      ctx.beginPath();

      for(
        let i=0;
        i<8;
        i++
      ){

        const a=
          Math.PI*2*i/8;

        const radius=
          i%2===0
          ? r.w/2
          : r.w/3;


        const x=
          Math.cos(a)*radius;

        const y=
          Math.sin(a)*radius;


        if(i===0){
          ctx.moveTo(x,y);
        }else{
          ctx.lineTo(x,y);
        }

      }

      ctx.closePath();

      ctx.fill();

    }


    /* 추적 */

    else if(r.type===6){

      ctx.fillStyle="#ff55ff";

      ctx.shadowColor="#ff55ff";


      ctx.beginPath();

      ctx.arc(
        0,
        0,
        r.w/2,
        0,
        Math.PI*2
      );

      ctx.fill();


      ctx.strokeStyle="#fff";

      ctx.lineWidth=3;


      ctx.beginPath();

      ctx.arc(
        0,
        0,
        r.w/2-5,
        0,
        Math.PI*2
      );

      ctx.stroke();


      ctx.beginPath();

      ctx.moveTo(
        -r.w/2-4,
        0
      );

      ctx.lineTo(
        -r.w/2+7,
        0
      );


      ctx.moveTo(
        r.w/2+4,
        0
      );

      ctx.lineTo(
        r.w/2-7,
        0
      );


      ctx.moveTo(
        0,
        -r.h/2-4
      );

      ctx.lineTo(
        0,
        -r.h/2+7
      );


      ctx.moveTo(
        0,
        r.h/2+4
      );

      ctx.lineTo(
        0,
        r.h/2-7
      );


      ctx.stroke();

    }


    /* 지그재그 */

    else if(r.type===7){

      ctx.fillStyle="#66e6ff";

      ctx.shadowColor="#66e6ff";


      ctx.beginPath();

      for(
        let i=0;
        i<8;
        i++
      ){

        const a=
          Math.PI*2*i/8;

        const radius=
          i%2===0
          ? r.w/2
          : r.w/4;


        const x=
          Math.cos(a)*radius;

        const y=
          Math.sin(a)*radius;


        if(i===0){
          ctx.moveTo(x,y);
        }else{
          ctx.lineTo(x,y);
        }

      }

      ctx.closePath();

      ctx.fill();

    }


    /* 강화 중장 */

    else if(r.type===8){

      ctx.fillStyle="#9fa8ff";

      ctx.shadowColor="#6977ff";


      ctx.beginPath();

      for(
        let i=0;
        i<8;
        i++
      ){

        const a=
          Math.PI*2*i/8;

        const x=
          Math.cos(a)*r.w/2;

        const y=
          Math.sin(a)*r.h/2;


        if(i===0){
          ctx.moveTo(x,y);
        }else{
          ctx.lineTo(x,y);
        }

      }

      ctx.closePath();

      ctx.fill();


      ctx.strokeStyle="#fff";

      ctx.lineWidth=2;

      ctx.stroke();


      ctx.fillStyle="#111";

      ctx.font=
        "bold 13px Arial";

      ctx.textAlign="center";

      ctx.fillText(
        r.hp,
        0,
        4
      );

    }


    /* 초분열 */

    else if(r.type===9){

      ctx.fillStyle="#ff66cc";

      ctx.shadowColor="#ff66cc";


      ctx.beginPath();

      for(
        let i=0;
        i<12;
        i++
      ){

        const a=
          Math.PI*2*i/12;

        const radius=
          i%2===0
          ? r.w/2
          : r.w/3.5;


        const x=
          Math.cos(a)*radius;

        const y=
          Math.sin(a)*radius;


        if(i===0){
          ctx.moveTo(x,y);
        }else{
          ctx.lineTo(x,y);
        }

      }

      ctx.closePath();

      ctx.fill();


      ctx.fillStyle="#fff";


      ctx.beginPath();

      ctx.arc(
        0,
        0,
        4,
        0,
        Math.PI*2
      );

      ctx.fill();

    }


    ctx.restore();

  }


  /* =====================================================
     총알
  ===================================================== */

  ctx.fillStyle=
    laser
    ? "#ffd000"
    : "#55f5ff";


  for(const b of bullets){

    ctx.fillRect(
      b.x,
      b.y,
      b.w,
      b.h
    );

  }


  /* =====================================================
     보스
  ===================================================== */

  if(boss){

    ctx.fillStyle=
      stage===30
      ? "#ff003c"
      : "#d822ff";


    ctx.shadowBlur=25;

    ctx.shadowColor=
      ctx.fillStyle;


    ctx.beginPath();

    ctx.roundRect(
      boss.x,
      boss.y,
      boss.w,
      boss.h,
      20
    );

    ctx.fill();


    ctx.shadowBlur=0;

    ctx.fillStyle="#fff";

    ctx.font=
      "bold 22px Arial";


    ctx.fillText(

      stage===30
      ? "👑 FINAL BOSS"
      : "☠️ BOSS",

      boss.x+65,
      boss.y+58

    );


    /* HP */

    ctx.fillStyle="#300";

    ctx.fillRect(
      70,
      62,
      340,
      12
    );


    ctx.fillStyle="#52ff72";

    ctx.fillRect(

      70,
      62,

      340*
      Math.max(
        0,
        boss.hp/
        boss.maxHp
      ),

      12

    );

  }


  /* =====================================================
     파티클
  ===================================================== */

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(
        0,
        p.life
      );


    ctx.fillStyle=
      p.color;


    ctx.fillRect(
      p.x,
      p.y,
      5,
      5
    );

  }

  ctx.globalAlpha=1;


  /* =====================================================
     조작
  ===================================================== */

  ctx.fillStyle="#aeb5d8";

  ctx.font=
    "13px Arial";


  ctx.fillText(
    "← → 이동 | SPACE 공격 | Q 방어막 | E 시간정지",
    65,
    700
  );

}


/* =========================================================
   게임 루프
========================================================= */

function gameLoop(now){

  if(!running){
    return;
  }


  const dt=
    Math.min(
      (now-lastTime)/1000,
      .033
    );


  lastTime=now;


  update(dt);

  draw();


  if(running){

    requestAnimationFrame(
      gameLoop
    );

  }

}


/* =========================================================
   초기 화면
========================================================= */

draw();

</script>

</body>
</html>
