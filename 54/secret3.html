<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>한도윤 천재</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Noto Sans KR", Arial, sans-serif;
    background: #fff8c9;
    color: #332b00;
}


/* 상단 */

.top-line {
    height: 8px;
    background: #f2c400;
}

header {
    background: white;
    padding: 25px 40px;
    border-bottom: 1px solid #eadb76;
}

.header-inner {
    max-width: 1100px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 20px;
    font-weight: 900;
    color: #6b5700;
}

.logo-sub {
    margin-top: 5px;
    font-size: 11px;
    color: #9b8a35;
}


/* 메인 */

.hero {
    min-height: 500px;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 70px 20px;

    background:
        linear-gradient(
            135deg,
            #fff3a3,
            #ffe44d
        );
}

.hero-box {
    width: min(900px, 95%);

    padding: 70px 40px;

    background: rgba(255,255,255,0.94);

    border: 3px solid #e0b900;

    box-shadow:
        0 20px 50px rgba(100,80,0,0.15);

    text-align: center;
}


/* 작은 제목 */

.small-title {
    font-size: 13px;

    letter-spacing: 5px;

    color: #9a7d00;

    font-weight: bold;
}


/* 메인 제목 */

h1 {
    margin: 25px 0 10px;

    font-size: clamp(45px, 8vw, 85px);

    font-weight: 1000;

    color: #d39f00;

    letter-spacing: -4px;
}


/* 강조 */

.highlight {
    display: inline-block;

    margin-top: 20px;

    padding: 12px 30px;

    background: #ffd900;

    color: #3d3200;

    font-size: 18px;

    font-weight: 900;
}


/* 설명 */

.description {
    margin-top: 30px;

    font-size: 16px;

    line-height: 1.8;

    color: #655b25;
}


/* 정보 */

.info {
    margin: 35px auto 0;

    max-width: 600px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}

.info-box {
    padding: 20px;

    background: #fffbea;

    border: 1px solid #eadb76;
}

.info-title {
    font-size: 10px;

    letter-spacing: 2px;

    color: #a38d28;
}

.info-value {
    margin-top: 7px;

    font-size: 17px;

    font-weight: 900;

    color: #5d4c00;
}


/* 돌아가기 */

.back {
    display: inline-block;

    margin-top: 40px;

    padding: 13px 28px;

    background: #d8ae00;

    color: white;

    text-decoration: none;

    font-size: 13px;

    font-weight: bold;

    transition: 0.2s;
}

.back:hover {
    background: #b68e00;
}


/* 하단 */

footer {
    padding: 25px;

    background: #4f4300;

    color: #fff4a8;

    text-align: center;

    font-size: 11px;
}


/* 모바일 */

@media (max-width: 650px) {

    header {
        padding: 20px;
    }

    .header-inner {
        display: block;
        text-align: center;
    }

    .hero-box {
        padding: 50px 20px;
    }

    h1 {
        letter-spacing: -3px;
    }

    .info {
        grid-template-columns: 1fr;
    }
}
.minecraft {
    width: 100%;
    max-width: 500px;
    display: block;
    margin: 25px auto;
    border-radius: 12px;
}
</style>

</head>


<body>


<div class="top-line"></div>


<header>

    <div class="header-inner">

        <div>

            <a href="index.html" class="logo">GIMBAP CLASS</a>

            <div class="logo-sub">
                NASEONG ELEMENTARY SCHOOL · 5-4
            </div>

        </div>

    </div>

</header>


<section class="hero">

    <div class="hero-box">

        <div class="small-title">
            SPECIAL CLASS ARCHIVE
        </div>


        <h1>
            한도윤 천재
        </h1>


        <div class="highlight">
            HAN DO-YOON · GENIUS
        </div>
        <img src="54img/minecraft.jpg" alt="Minecraft" class="minecraft">

        <p class="description">

            김밥반 특별 기록 보관소에 등록된<br>
            인물에 관한 페이지입니다.

        </p>


        <div class="info">

            <div class="info-box">

                <div class="info-title">
                    NAME
                </div>

                <div class="info-value">
                    한도윤
                </div>

            </div>


            <div class="info-box">

                <div class="info-title">
                    TITLE
                </div>

                <div class="info-value">
                    천재
                </div>

            </div>

        </div>


        <a href="index.html" class="back">
            ← 김밥반 홈페이지로
        </a>

    </div>

</section>


<footer>

    GIMBAP CLASS · 사실 한도윤한테 협박 받음 · 2026

</footer>


</body>

</html>
