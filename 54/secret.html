<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>13일의 김남우</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: "Noto Sans KR", Arial, sans-serif;

            color: #26342a;

            background: #f5f8f3;
        }

        /* 상단 */

        .top-line {
            height: 5px;

            background: #69a83f;
        }

        /* 헤더 */

        header {
            background: white;

            border-bottom: 1px solid #dfe7dc;
        }

        .header-inner {
            max-width: 1200px;

            margin: auto;

            padding: 28px 35px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .logo {
            text-decoration: none;

            color: #18351f;

            font-size: 20px;

            font-weight: 900;
        }

        .secret-label {
            margin-top: 5px;

            color: #7a857c;

            font-size: 10px;

            letter-spacing: 2px;
        }

        .back-button {
            padding: 9px 18px;

            border: 1px solid #d5e2d1;

            background: white;

            color: #3e7438;

            text-decoration: none;

            font-size: 12px;

            font-weight: 700;

            transition: 0.2s;
        }

        .back-button:hover {
            background: #eef7e9;
        }


        /* 비밀 페이지 제목 */

        .hero {
            background:
                linear-gradient(
                    110deg,
                    #dcefd3,
                    #f7faf5
                );

            border-bottom: 1px solid #dce6d8;
        }

        .hero-inner {
            max-width: 1200px;

            margin: auto;

            padding: 70px 35px;
        }

        .hero-kicker {
            color: #4e9236;

            font-size: 11px;

            font-weight: 900;

            letter-spacing: 3px;
        }

        .hero h1 {
            margin: 15px 0 12px;

            color: #18351f;

            font-size: 48px;

            letter-spacing: -2px;
        }

        .hero p {
            margin: 0;

            color: #68756c;

            font-size: 14px;

            line-height: 1.8;
        }


        /* 메뉴 */

        main {
            max-width: 1200px;

            margin: auto;

            padding: 50px 35px 80px;
        }

        .section-title {
            margin-bottom: 20px;

            color: #18351f;

            font-size: 22px;

            font-weight: 900;
        }

        .menu-grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 22px;
        }


        /* 카드 */

        .menu-card {
            position: relative;

            min-height: 250px;

            padding: 35px;

            background: white;

            border: 1px solid #dfe7dc;

            box-shadow:
                0 10px 30px rgba(30, 60, 30, 0.06);

            text-decoration: none;

            color: inherit;

            transition: 0.25s;
        }

        .menu-card:hover {
            transform: translateY(-5px);

            border-color: #9fc690;

            box-shadow:
                0 15px 35px rgba(30, 60, 30, 0.10);
        }


        /* 번호 */

        .number {
            color: #70a953;

            font-size: 12px;

            font-weight: 900;

            letter-spacing: 2px;
        }


        /* 아이콘 */

        .icon {
            width: 65px;
            height: 65px;

            margin: 25px 0 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #eef7e9;

            color: #4b9135;

            font-size: 22px;

            font-weight: 900;
        }


        .menu-card h2 {
            margin: 0 0 10px;

            color: #245f2c;

            font-size: 24px;
        }

        .menu-card p {
            margin: 0;

            color: #6c776f;

            font-size: 13px;

            line-height: 1.8;
        }


        /* 오른쪽 화살표 */

        .arrow {
            position: absolute;

            right: 30px;

            bottom: 25px;

            color: #4f9138;

            font-size: 20px;

            font-weight: 900;
        }


        /* 안내 */

        .notice {
            margin-top: 30px;

            padding: 20px 25px;

            background: #edf6e9;

            border-left: 4px solid #69a83f;

            color: #536456;

            font-size: 12px;

            line-height: 1.8;
        }


        /* 푸터 */

        footer {
            background: #005522;

            color: white;
        }

        .footer-inner {
            max-width: 1200px;

            margin: auto;

            padding: 30px 35px;

            display: flex;

            justify-content: space-between;
        }

        .footer-title {
            font-size: 13px;

            font-weight: 800;
        }

        .footer-text {
            margin-top: 7px;

            color: #c8dfcd;

            font-size: 10px;
        }


        /* 모바일 */

        @media (max-width: 700px) {

            .header-inner {
                padding: 22px 20px;
            }

            .hero-inner {
                padding: 50px 20px;
            }

            .hero h1 {
                font-size: 38px;
            }

            main {
                padding: 35px 20px 60px;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .footer-inner {
                padding: 25px 20px;

                flex-direction: column;

                gap: 20px;
            }

        }

    </style>

</head>


<body>


<div class="top-line"></div>


<header>

    <div class="header-inner">

        <div>

            <a href="index.html" class="logo">
                김밥반
            </a>

            <div class="secret-label">
                5·4 CLASS SECRET ARCHIVE
            </div>

        </div>


        <a href="index.html" class="back-button">
            메인 홈페이지
        </a>

    </div>

</header>


<section class="hero">

    <div class="hero-inner">

        <div class="hero-kicker">
            SECRET PAGE
        </div>

        <h1>
            김밥반 비밀 페이지
        </h1>

        <p>
            숨겨진 2026년3월13일
        </p>

    </div>

</section>


<main>


    <div class="section-title">
        SPECIAL MENU
    </div>


    <div class="menu-grid">


        <!-- 게임 모음 -->

        <a href="haha.html" class="menu-card">

            <div class="number">
                01
            </div>

            <div class="icon">
                haha
            </div>

            <h2>
                haha 모음
            </h2>

            <p>
                그냥 haha 모음
            </p>

            <div class="arrow">
                →
            </div>

        </a>


        <!-- 오이일보 -->

        <a href="oinews.html" class="menu-card">

            <div class="number">
                02
            </div>

            <div class="icon">
                NEWS
            </div>

            <h2>
                오이일보
            </h2>

            <p>
                오이일보를 온라인에서   
            </p>

            <div class="arrow">
                →
            </div>

        </a>


    </div>


    <div class="notice">

        이 페이지는 김밥반 홈페이지의 특별 메뉴입니다.
        메뉴를 선택하면 해당 페이지로 이동합니다.

    </div>


</main>


<footer>

    <div class="footer-inner">

        <div>

            <div class="footer-title">
                나성초등학교 5학년 4반 김밥반
            </div>

            <div class="footer-text">
                5·4 CLASS SECRET ARCHIVE
            </div>

        </div>

    </div>

</footer>


</body>

</html>
