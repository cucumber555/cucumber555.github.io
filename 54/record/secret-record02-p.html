<div class="access-box">

    <div class="access-title">
        RESTRICTED RECORD
    </div>

    <p>
        이 기록은 잠겨 있습니다.<br>
        ACCESS CODE를 입력하세요.
    </p>

    <input
        type="password"
        id="code"
        placeholder="ACCESS CODE"
        autocomplete="off"
    >

    <button type="button" onclick="checkCode()">
        UNLOCK
    </button>

    <div id="result"></div>

</div>

<script>
function checkCode() {

    const input = document.getElementById("code").value.trim();
    const result = document.getElementById("result");

    if (input === "5467") {

        result.textContent = "ACCESS GRANTED";

        setTimeout(function() {
            window.location.href = "secret-record02.html";
        }, 700);

    } else {

        result.textContent = "ACCESS DENIED";
    }
}
</script>
