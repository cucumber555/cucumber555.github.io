<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" href="../54/54img/favicon4.png">
<title>공룡 달리기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dino:#f4c752; --dino-dark:#cf8a2b;
    --gold:#f4c752; --mint:#4de0c0;
    --ink:#120826;
    --text:#f4ecff; --text-dim:#a892c9;
    --panel:rgba(30,17,52,.72); --panel-line:rgba(255,255,255,.08);
    --bg:#0e0620;
  }
  :root:not([data-theme="light"]){ --bg:#0e0620; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0e0620; } }
  :root[data-theme="dark"]{ --bg:#0e0620; }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(1200px 600px at 78% -10%, rgba(255,140,80,.18), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(77,224,192,.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:"Sora",system-ui,sans-serif;
    display:flex; justify-content:center;
    padding:26px 16px 46px;
    -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  }
  .wrap{ width:100%; max-width:920px; }

  header{ margin-bottom:16px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .logo{ font-size:30px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
  h1{ font-size:clamp(21px,4.4vw,30px); font-weight:800; letter-spacing:-.5px; line-height:1; }
  h1 .thin{ font-weight:500; color:var(--text-dim); }
  .sub{ color:var(--text-dim); font-size:13.5px; margin-top:5px; max-width:520px; line-height:1.5; }
  .tagbadge{
    align-self:flex-start; font-size:11px; font-weight:600; letter-spacing:.4px;
    color:var(--mint); border:1px solid rgba(77,224,192,.35);
    padding:5px 11px; border-radius:999px; white-space:nowrap;
    background:rgba(77,224,192,.06);
  }

  .stage{
    position:relative; width:100%;
    border-radius:20px; overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.06), inset 0 0 60px rgba(0,0,0,.35);
    background:#160b30; touch-action:none;
  }
  canvas{ display:block; width:100%; height:auto; }

  .hud{ position:absolute; top:0; left:0; right:0; padding:16px 18px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
  .scorewrap{ text-shadow:0 2px 8px rgba(0,0,0,.5); }
  .scorewrap .label{ font-size:10.5px; font-weight:600; letter-spacing:2px; color:var(--text-dim); }
  .scorewrap .score{ font-family:"Space Grotesk",monospace; font-size:34px; font-weight:700; line-height:.95; letter-spacing:-1px; font-variant-numeric:tabular-nums; }
  .scorewrap .score .u{ font-size:16px; color:var(--text-dim); margin-left:3px; }
  .hud .right{ display:flex; align-items:center; gap:10px; }
  .hival{ text-align:right; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  .hival .label{ font-size:10px; font-weight:600; letter-spacing:2px; color:var(--gold); }
  .hival .v{ font-family:"Space Grotesk",monospace; font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; }
  .icon-btn{
    pointer-events:auto; width:40px; height:40px; border-radius:12px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
    color:var(--text); font-size:18px; cursor:pointer; display:none;
    align-items:center; justify-content:center; transition:background .15s, transform .1s;
    backdrop-filter:blur(6px);
  }
  .icon-btn:hover{ background:rgba(255,255,255,.14); }
  .icon-btn:active{ transform:scale(.92); }
  .icon-btn.show{ display:flex; }

  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:24px; background:rgba(14,6,32,.66); backdrop-filter:blur(3px); }
  .overlay.hidden{ display:none; }
  .overlay .big{ font-size:clamp(20px,4vw,30px); font-weight:800; letter-spacing:-.5px; }
  .overlay .msg{ color:var(--text-dim); font-size:14px; max-width:340px; line-height:1.6; }

  .finalcard{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .finalcard .newrec{ font-size:12px; font-weight:700; letter-spacing:1px; color:var(--mint); margin-bottom:2px; opacity:0; transform:translateY(4px); }
  .finalcard.rec .newrec{ opacity:1; transform:none; transition:.4s; }
  .finalcard .big{ color:var(--gold); }
  .finalcard .final{ font-family:"Space Grotesk",monospace; font-size:52px; font-weight:700; letter-spacing:-2px; line-height:1; font-variant-numeric:tabular-nums; }
  .finalcard .final .u{ font-size:22px; color:var(--text-dim); }

  .btn{ font-family:"Sora",sans-serif; font-size:14px; font-weight:700; background:linear-gradient(180deg,#ffd875,#f4c752); color:var(--ink); border:none; border-radius:13px; padding:13px 26px; cursor:pointer; box-shadow:0 6px 0 var(--dino-dark), 0 12px 24px -8px rgba(244,199,82,.6); transition:transform .07s, box-shadow .07s; }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--dino-dark); }
  .btn.ghost{ background:transparent; color:var(--text); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2); }
  .btnrow{ display:flex; gap:10px; }

  .namerow{ display:flex; gap:9px; align-items:center; }
  .namerow input{ font-family:"Sora",sans-serif; font-size:16px; font-weight:600; background:rgba(0,0,0,.35); color:var(--text); border:1.5px solid var(--panel-line); border-radius:12px; padding:13px 16px; width:200px; text-align:center; outline:none; transition:border-color .15s; }
  .namerow input::placeholder{ color:var(--text-dim); font-weight:500; }
  .namerow input:focus{ border-color:var(--gold); }

  .mini{ width:100%; max-width:320px; }
  .mini .mtitle{ font-size:10.5px; font-weight:700; letter-spacing:2px; color:var(--text-dim); margin-bottom:8px; }
  .mini ol{ list-style:none; display:flex; flex-direction:column; gap:3px; }
  .mini li{ display:grid; grid-template-columns:26px 1fr auto; align-items:center; gap:8px; font-size:13.5px; padding:5px 8px; border-radius:8px; }
  .mini li .r{ font-family:"Space Grotesk",monospace; font-size:12px; color:var(--text-dim); }
  .mini li .n{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; }
  .mini li .p{ font-family:"Space Grotesk",monospace; color:var(--gold); font-variant-numeric:tabular-nums; }
  .mini li.me{ background:rgba(244,199,82,.14); }
  .mini li.me .n{ color:var(--gold); font-weight:700; }

  .touch-controls{ position:absolute; bottom:14px; left:16px; right:16px; display:none; justify-content:space-between; pointer-events:none; }
  .touch-controls.on{ display:flex; }
  .tbtn{ pointer-events:auto; width:96px; height:56px; font-family:"Sora",sans-serif; font-size:12px; font-weight:700; letter-spacing:.5px; background:rgba(255,255,255,.08); color:var(--text); border:1px solid rgba(255,255,255,.14); border-radius:14px; backdrop-filter:blur(6px); }
  .tbtn:active{ background:rgba(255,255,255,.2); }

  .board{ margin-top:24px; background:var(--panel); border:1px solid var(--panel-line); border-radius:18px; padding:20px 20px 10px; backdrop-filter:blur(12px); }
  .board h2{ font-size:14px; font-weight:700; letter-spacing:.3px; display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .board h2 .crown{ color:var(--gold); }
  .board .clear{ font-family:"Sora",sans-serif; font-size:12px; font-weight:500; background:none; border:none; color:var(--text-dim); cursor:pointer; }
  .board .clear:hover{ color:var(--text); }
  ol.scores{ list-style:none; }
  ol.scores li{ display:grid; grid-template-columns:38px 1fr auto; align-items:center; gap:12px; padding:10px 8px; border-bottom:1px solid rgba(255,255,255,.05); font-size:15px; }
  ol.scores li:last-child{ border-bottom:none; }
  ol.scores li .rank{ font-family:"Space Grotesk",monospace; font-size:14px; font-weight:600; color:var(--text-dim); }
  ol.scores li .who{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  ol.scores li .pts{ font-family:"Space Grotesk",monospace; font-size:15px; color:var(--gold); font-variant-numeric:tabular-nums; }
  ol.scores li.top1 .rank{ color:#ffd23f; } ol.scores li.top2 .rank{ color:#d9d4e8; } ol.scores li.top3 .rank{ color:#e0955a; }
  ol.scores li.me{ background:rgba(244,199,82,.12); border-radius:10px; }
  ol.scores li.me .who{ color:var(--gold); font-weight:700; }
  .board .empty{ color:var(--text-dim); font-size:14px; padding:14px 8px 18px; }

  .hint{ margin-top:16px; color:var(--text-dim); font-size:12.5px; line-height:1.7; }
  .hint kbd{ font-family:"Space Grotesk",monospace; font-size:11px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:6px; padding:2px 7px; color:var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="logo">🦕</span>
      <div>
        <h1>공룡 달리기 <span class="thin">DUSK RUN</span></h1>
        <p class="sub">노을 진 사막을 달려라. 뛰거나 숙여 장애물을 피하고, 최고 기록에 이름을 남겨봐.</p>
      </div>
    </div>
    <span class="tagbadge">천천히 시작 · 서서히 가속</span>
  </header>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="hud">
      <div class="scorewrap">
        <div class="label">SCORE</div>
        <div class="score"><span id="score">0</span><span class="u">m</span></div>
      </div>
      <div class="right">
        <div class="hival"><div class="label">BEST</div><div class="v" id="hi">0</div></div>
        <button class="icon-btn" id="restartBtn" title="다시 시작">⟳</button>
      </div>
    </div>

    <div class="touch-controls" id="touch">
      <button class="tbtn" id="tduck">▽ 숙이기</button>
      <button class="tbtn" id="tjump">△ 점프</button>
    </div>

    <div class="overlay" id="startOverlay">
      <div class="big">이름을 정해줘</div>
      <div class="namerow"><input id="nameInput" maxlength="12" placeholder="이름 입력" autocomplete="off"></div>
      <div class="msg">스페이스 · 화면 탭으로 점프, ↓ 로 숙이기.<br>이 이름으로 랭킹에 자동 등록돼.</div>
      <button class="btn" id="startBtn">달리기 시작</button>
    </div>

    <div class="overlay hidden" id="overOverlay">
      <div class="finalcard" id="finalCard">
        <div class="newrec">✦ 신기록 ✦</div>
        <div class="big">게임 오버</div>
        <div class="final"><span id="finalScore">0</span><span class="u">m</span></div>
      </div>
      <div id="overBody"></div>
    </div>
  </div>

  <section class="board">
    <h2><span><span class="crown">♛</span> 명예의 전당 · TOP 20</span><button class="clear" id="clearBtn">기록 지우기</button></h2>
    <ol class="scores" id="scoreList"></ol>
    <div class="empty" id="emptyMsg">아직 기록이 없어. 첫 주자가 되어봐.</div>
  </section>

  <p class="hint"><kbd>SPACE</kbd> / <kbd>↑</kbd> 점프 · <kbd>↓</kbd> 숙이기 · <kbd>R</kbd> 또는 <kbd>ENTER</kbd> 다시 시작 · 모바일은 화면 버튼</p>
</div>

<script>
(() => {
  "use strict";
  const KEY_SCORES="dinoRun.scores.v3", KEY_NAME="dinoRun.name.v1", KEY_HI="dinoRun.hi.v3";
  const loadScores=()=>{try{const a=JSON.parse(localStorage.getItem(KEY_SCORES)||"[]");return Array.isArray(a)?a:[];}catch(e){return[];}};
  const saveScores=a=>{try{localStorage.setItem(KEY_SCORES,JSON.stringify(a));}catch(e){}};
  const loadName=()=>{try{return localStorage.getItem(KEY_NAME)||"";}catch(e){return"";}};
  const saveName=n=>{try{localStorage.setItem(KEY_NAME,n);}catch(e){}};
  const loadHi=()=>{try{return parseInt(localStorage.getItem(KEY_HI)||"0",10)||0;}catch(e){return 0;}};
  const saveHi=v=>{try{localStorage.setItem(KEY_HI,String(v));}catch(e){}};

  const LW=900, LH=300, GROUND_Y=248, GRAV=2400, JUMP_V=-780, DUCK_CUT=0.55;
  const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
  function fit(){ const cssW=canvas.clientWidth||LW; const dpr=Math.min(window.devicePixelRatio||1,2); const scale=(cssW/LW)*dpr; canvas.width=Math.round(LW*scale); canvas.height=Math.round(LH*scale); ctx.setTransform(scale,0,0,scale,0,0); }
  function applyAspect(){ canvas.style.height=(canvas.clientWidth*LH/LW)+"px"; }
  new ResizeObserver(()=>{applyAspect();fit();}).observe(canvas);

  let state="start", score=0, hi=loadHi(), speed=300, elapsed=0, dist=0;
  let spawnTimer=0, nextGap=1.4, obstacles=[], clouds=[], dust=[];
  let groundOffset=0, bgFar=0, bgMid=0, bgNear=0, last=0, timeAcc=0, lastEntryId=null, overAt=0;
  let currentName=loadName();
  const dino={x:96, y:GROUND_Y, w:46, h:48, vy:0, onGround:true, ducking:false, legT:0, dustT:0};
  const rand=(a,b)=>a+Math.random()*(b-a);

  let ac=null;
  function beep(f,d,t,v){ try{ if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(),g=ac.createGain(); o.type=t||"square"; o.frequency.value=f; g.gain.value=v||0.05; o.connect(g);g.connect(ac.destination); const n=ac.currentTime; o.start(n); g.gain.exponentialRampToValueAtTime(0.0001,n+d); o.stop(n+d+0.02);}catch(e){} }

  function jump(){ if(state!=="playing")return; if(dino.onGround){ dino.vy=JUMP_V; dino.onGround=false; beep(560,0.08,"square",0.045); for(let i=0;i<6;i++)emitDust(true); } }
  function jumpCut(){ if(dino.vy<0)dino.vy*=DUCK_CUT; }
  function setDuck(v){ if(state==="playing")dino.ducking=v; }

  window.addEventListener("keydown",e=>{
    if(document.activeElement===nameInput){ if(e.code==="Enter"){e.preventDefault();tryStart();} return; }
    if(["Space","ArrowUp","ArrowDown","Enter","KeyR"].includes(e.code))e.preventDefault();
    if(e.repeat)return;
    if(e.code==="Space"||e.code==="ArrowUp"){ if(state==="start")tryStart(); else if(state==="over")startGame(); else jump(); }
    else if(e.code==="ArrowDown")setDuck(true);
    else if(e.code==="Enter"){ if(state==="start")tryStart(); else if(state==="over")startGame(); }
    else if(e.code==="KeyR"){ if(state==="start")tryStart(); else startGame(); }
  });
  window.addEventListener("keyup",e=>{ if(e.code==="Space"||e.code==="ArrowUp")jumpCut(); else if(e.code==="ArrowDown")setDuck(false); });

  const stage=document.getElementById("stage");
  stage.addEventListener("pointerdown",e=>{ if(e.target.closest(".btn,input,.tbtn,.clear,.icon-btn"))return; if(state==="playing")jump(); });
  stage.addEventListener("pointerup",jumpCut);

  const isTouch=matchMedia("(hover: none) and (pointer: coarse)").matches||("ontouchstart" in window);
  if(isTouch)document.getElementById("touch").classList.add("on");
  const tjump=document.getElementById("tjump"), tduck=document.getElementById("tduck");
  const stop=e=>e.preventDefault();
  tjump.addEventListener("pointerdown",e=>{stop(e);if(state==="playing")jump();}); tjump.addEventListener("pointerup",jumpCut);
  tduck.addEventListener("pointerdown",e=>{stop(e);setDuck(true);}); tduck.addEventListener("pointerup",e=>{stop(e);setDuck(false);}); tduck.addEventListener("pointerleave",()=>setDuck(false));

  const restartBtn=document.getElementById("restartBtn");
  restartBtn.addEventListener("click",()=>startGame());

  const nameInput=document.getElementById("nameInput");
  nameInput.value=currentName;
  function tryStart(){
    const n=(nameInput.value||"").trim().slice(0,12);
    if(!n){ nameInput.focus(); nameInput.style.borderColor="#ff6b8a"; setTimeout(()=>nameInput.style.borderColor="",900); return; }
    currentName=n; saveName(n); startGame();
  }

  function emitDust(burst){ dust.push({x:dino.x+8, y:GROUND_Y-2, vx:-speed*0.28-rand(20,70), vy:-rand(burst?30:8,burst?90:36), life:rand(0.3,0.6), t:0, r:rand(1.5,3.2)}); }

  function spawn(){
    const canBird=elapsed>13;
    const roll=Math.random();
    if(canBird && roll<0.28){
      const tier=Math.floor(rand(0,3));
      const yTop=[GROUND_Y-32,GROUND_Y-68,GROUND_Y-104][tier];
      obstacles.push({type:"bird",x:LW+20,y:yTop,w:46,h:30,flap:0});
    }else{
      const kind=roll<0.5?"s":(roll<0.8?"l":"cluster");
      let w,h,n=1;
      if(kind==="s"){w=18;h=38;} else if(kind==="l"){w=24;h=52;} else {n=Math.floor(rand(2,4));w=18*n+6*(n-1);h=40;}
      obstacles.push({type:"cactus",x:LW+20,y:GROUND_Y,w,h,n,big:kind==="l"});
    }
  }
  const hitbox=()=> (dino.ducking&&dino.onGround)?{x:dino.x+4,y:GROUND_Y-30,w:58,h:30}:{x:dino.x+8,y:dino.y-dino.h+6,w:dino.w-14,h:dino.h-8};
  const obBox=o=> o.type==="bird"?{x:o.x+6,y:o.y+6,w:o.w-12,h:o.h-10}:{x:o.x+3,y:o.y-o.h+4,w:o.w-6,h:o.h-6};
  const overlap=(a,b)=> a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

  const startOverlay=document.getElementById("startOverlay"), overOverlay=document.getElementById("overOverlay");
  const overBody=document.getElementById("overBody"), finalScoreEl=document.getElementById("finalScore");
  const scoreEl=document.getElementById("score"), hiEl=document.getElementById("hi"), finalCard=document.getElementById("finalCard");

  function resetRun(){ score=0; speed=300; elapsed=0; dist=0; spawnTimer=0; nextGap=1.4; obstacles=[]; dust=[]; lastEntryId=null; dino.y=GROUND_Y; dino.vy=0; dino.onGround=true; dino.ducking=false; seedClouds(); }
  function startGame(){
    if(!currentName){ startOverlay.classList.remove("hidden"); overOverlay.classList.add("hidden"); restartBtn.classList.remove("show"); nameInput.focus(); return; }
    resetRun(); state="playing"; startOverlay.classList.add("hidden"); overOverlay.classList.add("hidden"); restartBtn.classList.add("show"); if(ac&&ac.state==="suspended")ac.resume();
  }

  function gameOver(){
    state="over"; overAt=timeAcc; restartBtn.classList.remove("show");
    beep(180,0.16,"sawtooth",0.06); setTimeout(()=>beep(120,0.2,"sawtooth",0.06),90);
    const s=Math.floor(dist);
    const isRec=s>hi; if(isRec){ hi=s; saveHi(hi); }
    if(s>0 && qualifies(s)) addScore(currentName, s);
    finalScoreEl.textContent=s.toLocaleString();
    finalCard.classList.toggle("rec",isRec);
    hiEl.textContent=hi.toLocaleString();
    buildFinal(); renderBoard();
    overOverlay.classList.remove("hidden");
  }
  function qualifies(s){ const l=loadScores(); if(s<=0)return false; if(l.length<20)return true; return s>l[l.length-1].score; }

  function buildFinal(){
    overBody.innerHTML="";
    const box=document.createElement("div"); box.style.cssText="display:flex;flex-direction:column;gap:16px;align-items:center;width:100%";
    box.appendChild(renderMini());
    const row=document.createElement("div"); row.className="btnrow";
    const again=document.createElement("button"); again.className="btn"; again.textContent="다시 달리기 ⟳"; again.addEventListener("click",startGame);
    row.appendChild(again); box.appendChild(row);
    overBody.appendChild(box);
  }
  function renderMini(){
    const l=loadScores().slice(0,5); const mini=document.createElement("div"); mini.className="mini";
    if(l.length===0){ mini.innerHTML='<div class="msg">첫 기록을 세워봐.</div>'; return mini; }
    const t=document.createElement("div"); t.className="mtitle"; t.textContent="TOP 5"; mini.appendChild(t);
    const ol=document.createElement("ol");
    l.forEach((e,i)=>{ const li=document.createElement("li"); if(e.id&&e.id===lastEntryId)li.classList.add("me");
      li.innerHTML=`<span class="r">${(i+1).toString().padStart(2,"0")}</span><span class="n">${esc(e.name)}</span><span class="p">${e.score.toLocaleString()}</span>`; ol.appendChild(li); });
    mini.appendChild(ol); return mini;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  function addScore(name,s){ const l=loadScores(); const id=Date.now()+"_"+Math.random().toString(36).slice(2,7); l.push({id,name,score:s,at:Date.now()}); l.sort((a,b)=>b.score-a.score||a.at-b.at); const t=l.slice(0,20); saveScores(t); lastEntryId=t.some(e=>e.id===id)?id:null; }

  const scoreList=document.getElementById("scoreList"), emptyMsg=document.getElementById("emptyMsg");
  function renderBoard(){ const l=loadScores(); scoreList.innerHTML=""; if(!l.length){emptyMsg.style.display="block";return;} emptyMsg.style.display="none";
    l.forEach((e,i)=>{ const li=document.createElement("li"); if(i<3)li.classList.add("top"+(i+1)); if(e.id&&e.id===lastEntryId)li.classList.add("me");
      li.innerHTML=`<span class="rank">${(i+1).toString().padStart(2,"0")}</span><span class="who">${esc(e.name)}</span><span class="pts">${e.score.toLocaleString()}</span>`; scoreList.appendChild(li); }); }
  document.getElementById("clearBtn").addEventListener("click",()=>{ if(confirm("모든 기록을 지울까?")){ saveScores([]); lastEntryId=null; renderBoard(); } });

  function seedClouds(){ clouds=[]; for(let i=0;i<4;i++)clouds.push({x:rand(0,LW),y:rand(28,108),s:rand(0.12,0.35),w:rand(50,92)}); }

  function update(dt){
    elapsed+=dt;
    speed=300+Math.min(elapsed*11, 560);
    dist+=speed*dt/9;
    scoreEl.textContent=Math.floor(dist).toLocaleString();

    if(!dino.onGround){ dino.vy+=GRAV*dt; dino.y+=dino.vy*dt; if(dino.y>=GROUND_Y){ dino.y=GROUND_Y; dino.vy=0; dino.onGround=true; for(let i=0;i<4;i++)emitDust(true); } }
    dino.legT+=dt*(dino.onGround?12:0);
    if(dino.onGround && !dino.ducking){ dino.dustT+=dt; if(dino.dustT>0.09){ dino.dustT=0; emitDust(false); } }

    groundOffset=(groundOffset+speed*dt)%48; bgNear=(bgNear+speed*dt*0.5)%LW; bgMid=(bgMid+speed*dt*0.3)%LW; bgFar=(bgFar+speed*dt*0.1)%LW;
    for(const c of clouds){ c.x-=speed*dt*c.s; if(c.x<-c.w){ c.x=LW+rand(20,120); c.y=rand(28,108); } }

    for(const p of dust){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=260*dt; }
    dust=dust.filter(p=>p.t<p.life);

    spawnTimer+=dt;
    if(spawnTimer>=nextGap){ spawnTimer=0; spawn(); const base=Math.max(0.66,1.5-elapsed*0.012); nextGap=rand(base,base+0.75); }

    for(const o of obstacles){ o.x-=speed*dt; if(o.type==="bird")o.flap+=dt*14; }
    obstacles=obstacles.filter(o=>o.x+o.w>-10);

    const hb=hitbox();
    for(const o of obstacles){ if(overlap(hb,obBox(o))){ gameOver(); return; } }
  }

  const STARS=[]; for(let i=0;i<46;i++)STARS.push({x:rand(0,LW),y:rand(0,150),a:rand(0.2,0.85),ph:rand(0,6.28),sp:rand(1.5,3.5)});

  function draw(){
    const g=ctx.createLinearGradient(0,0,0,GROUND_Y+12);
    g.addColorStop(0,"#140a2e"); g.addColorStop(0.42,"#3d1656"); g.addColorStop(0.72,"#7d2359"); g.addColorStop(1,"#c94a5e");
    ctx.fillStyle=g; ctx.fillRect(0,0,LW,LH);

    for(const s of STARS){ ctx.globalAlpha=s.a*(0.45+0.55*Math.sin(timeAcc*s.sp+s.ph)); ctx.fillStyle="#fff"; ctx.fillRect(s.x,s.y,2,2); }
    ctx.globalAlpha=1;

    const sx=728, sy=98;
    const rg=ctx.createRadialGradient(sx,sy,6,sx,sy,92); rg.addColorStop(0,"rgba(255,224,120,.95)"); rg.addColorStop(0.45,"rgba(255,150,70,.4)"); rg.addColorStop(1,"rgba(255,120,80,0)");
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(sx,sy,92,0,7); ctx.fill();
    const sun=ctx.createLinearGradient(sx,sy-34,sx,sy+34); sun.addColorStop(0,"#ffe58a"); sun.addColorStop(1,"#ff9a45");
    ctx.fillStyle=sun; ctx.beginPath(); ctx.arc(sx,sy,34,0,7); ctx.fill();
    ctx.fillStyle="#7d2359"; for(let i=0;i<3;i++)ctx.fillRect(sx-40,sy+9+i*11,80,4);

    drawDunes(bgFar,GROUND_Y-2,50,"#3a1852"); drawDunes(bgFar*1.5+280,GROUND_Y,40,"#4a1e5c"); drawDunes(bgMid,GROUND_Y+2,28,"#37153f"); drawDunes(bgNear,GROUND_Y+3,16,"#2a1030");

    ctx.fillStyle="rgba(255,180,120,.16)"; for(const c of clouds)cloud(c.x,c.y,c.w);

    const gr=ctx.createLinearGradient(0,GROUND_Y,0,LH); gr.addColorStop(0,"#2a1236"); gr.addColorStop(1,"#1a0a26");
    ctx.fillStyle=gr; ctx.fillRect(0,GROUND_Y,LW,LH-GROUND_Y);
    ctx.strokeStyle="#ff9a3c"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,GROUND_Y+1.5); ctx.lineTo(LW,GROUND_Y+1.5); ctx.stroke();
    ctx.strokeStyle="rgba(255,154,60,.32)"; ctx.lineWidth=2;
    for(let x=-groundOffset;x<LW;x+=48){ ctx.beginPath(); ctx.moveTo(x,GROUND_Y+16); ctx.lineTo(x+22,GROUND_Y+16); ctx.stroke(); }
    for(let x=-groundOffset*1.3;x<LW;x+=70){ ctx.beginPath(); ctx.moveTo(x,GROUND_Y+30); ctx.lineTo(x+30,GROUND_Y+30); ctx.stroke(); }

    for(const p of dust){ ctx.globalAlpha=Math.max(0,1-p.t/p.life)*0.5; ctx.fillStyle="#e9c79a"; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;

    for(const o of obstacles){ o.type==="bird"?drawBird(o):drawCactus(o); }

    ctx.globalAlpha=(state==="over")?Math.max(0.35,1-(timeAcc-overAt)*1.4):1;
    drawDino(); ctx.globalAlpha=1;
  }

  function drawDunes(off,baseY,amp,color){ ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(0,baseY); const step=60; for(let x=-off%step-step;x<=LW+step;x+=step){ const y=baseY-amp*(0.5+0.5*Math.sin((x+off)*0.012)); ctx.lineTo(x,y); } ctx.lineTo(LW,baseY); ctx.lineTo(LW,GROUND_Y+3); ctx.lineTo(0,GROUND_Y+3); ctx.closePath(); ctx.fill(); }
  function cloud(x,y,w){ ctx.beginPath(); ctx.arc(x,y,w*0.22,0,7); ctx.arc(x+w*0.28,y-6,w*0.28,0,7); ctx.arc(x+w*0.6,y,w*0.24,0,7); ctx.rect(x-2,y,w*0.62,w*0.2); ctx.fill(); }

  function drawCactus(o){ ctx.fillStyle="#140820"; const n=o.n||1, unit=o.big?24:18; let x=o.x;
    for(let i=0;i<n;i++){ const h=o.h-(i%2)*6, top=GROUND_Y-h;
      ctx.fillRect(x+unit*0.35,top,unit*0.32,h); ctx.fillRect(x+unit*0.05,top+h*0.35,unit*0.3,unit*0.22); ctx.fillRect(x+unit*0.05,top+h*0.18,unit*0.16,h*0.22); ctx.fillRect(x+unit*0.62,top+h*0.28,unit*0.3,unit*0.22); ctx.fillRect(x+unit*0.78,top+h*0.1,unit*0.16,h*0.26); x+=unit+6; }
    ctx.fillStyle="rgba(255,154,60,.28)"; ctx.fillRect(o.x+(o.big?8:6),GROUND_Y-o.h,2,o.h); }
  function drawBird(o){ ctx.save(); ctx.translate(o.x,o.y); ctx.fillStyle="#140820"; ctx.fillRect(14,10,22,9); ctx.fillRect(30,6,12,9); ctx.fillStyle="#ff9a3c"; ctx.fillRect(42,9,7,4); ctx.fillStyle="#140820";
    if(Math.sin(o.flap)>0){ ctx.beginPath(); ctx.moveTo(16,10); ctx.lineTo(30,-6); ctx.lineTo(34,10); ctx.closePath(); ctx.fill(); } else { ctx.beginPath(); ctx.moveTo(16,16); ctx.lineTo(30,30); ctx.lineTo(34,16); ctx.closePath(); ctx.fill(); } ctx.restore(); }

  function drawDino(){ ctx.save(); ctx.translate(dino.x,0); const gold="#f4c752", dark="#cf8a2b";
    if(dino.ducking&&dino.onGround){ const top=GROUND_Y-30; ctx.fillStyle=gold; ctx.fillRect(4,top+4,54,22); ctx.fillRect(50,top,20,16); ctx.fillStyle=dark; ctx.fillRect(4,top+22,54,4); ctx.fillStyle="#140820"; ctx.fillRect(62,top+4,4,4);
      const f=Math.floor(dino.legT)%2; ctx.fillStyle=gold; ctx.fillRect(14+(f?0:8),GROUND_Y-8,8,8); ctx.fillRect(34+(f?8:0),GROUND_Y-8,8,8); ctx.restore(); return; }
    const bt=dino.y-48; ctx.fillStyle=gold;
    ctx.beginPath(); ctx.moveTo(0,bt+22); ctx.lineTo(-16,bt+14); ctx.lineTo(2,bt+34); ctx.closePath(); ctx.fill();
    ctx.fillRect(2,bt+8,30,30); ctx.fillRect(22,bt,24,22); ctx.fillRect(40,bt-2,10,12); ctx.fillRect(46,bt+6,8,7);
    ctx.fillStyle=dark; ctx.fillRect(2,bt+30,30,8); ctx.fillStyle="#140820"; ctx.fillRect(42,bt+2,4,4); ctx.fillStyle=dark; ctx.fillRect(30,bt+18,8,4);
    ctx.fillStyle=gold;
    if(dino.onGround){ const f=Math.floor(dino.legT)%2; if(f===0){ ctx.fillRect(8,dino.y-12,8,12); ctx.fillRect(22,dino.y-6,8,6); } else { ctx.fillRect(8,dino.y-6,8,6); ctx.fillRect(22,dino.y-12,8,12); } }
    else { ctx.fillRect(8,dino.y-10,8,10); ctx.fillRect(22,dino.y-10,8,10); }
    ctx.restore(); }

  function frame(ts){ if(!last)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; timeAcc+=dt; if(state==="playing")update(dt); draw(); requestAnimationFrame(frame); }

  applyAspect(); fit(); seedClouds(); renderBoard(); hiEl.textContent=hi.toLocaleString();
  document.getElementById("startBtn").addEventListener("click",tryStart);
  setTimeout(()=>{ if(state==="start" && !currentName) nameInput.focus(); },60);
  requestAnimationFrame(frame);
})();
</script>
</body>
