<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="../54/54img/favicon3.png">

    <title>게임 포털</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                "Pretendard",
                "Noto Sans KR",
                Arial,
                sans-serif;

            background:
                linear-gradient(135deg, #eef5ff, #f8fbff);

            color: #440d09;
        }

        .container {
            width: 90%;
            max-width: 520px;
            padding: 45px 40px;

            background: rgba(255, 255, 255, 0.92);
            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(22, 74, 138, 0.12);

            text-align: center;
        }

        .logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: #8a1616;
            color: white;

            font-size: 24px;
            font-weight: 800;

            box-shadow:
                0 8px 20px rgba(109, 23, 8, 0.25);
        }

        h1 {
            margin: 0;

            font-size: 28px;
            font-weight: 800;

            letter-spacing: -1px;
        }

        .subtitle {
            margin-top: 10px;
            margin-bottom: 32px;

            color: #7a8495;
            font-size: 14px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 게임 링크 */
        .game-link {
            display: flex;
            align-items: center;
            justify-content: space-between;

            width: 100%;
            min-height: 58px;

            padding: 0 20px;

            border: 1px solid #e3eaf3;
            border-radius: 14px;

            background: white;

            color: #4d120b;
            text-decoration: none;

            font-size: 16px;
            font-weight: 650;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .game-link::after {
            content: "›";

            font-size: 24px;
            color: #9aa6b7;
        }

        .game-link:hover {
            transform: translateY(-2px);

            border-color: #8a1616;

            box-shadow:
                0 8px 20px rgba(22, 74, 138, 0.12);
        }

        /* 자세히 보기로 숨겨놓은 게임들 */
        #hiddenGames {
            display: none;

            flex-direction: column;
            gap: 12px;

            margin-top: 12px;
        }

        #hiddenGames.show {
            display: flex;

            animation: showGames 0.25s ease;
        }

        @keyframes showGames {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 자세히 보기 버튼 */
        #detailButton {
            cursor: pointer;
        }

        .footer {
            margin-top: 28px;

            color: #a0a8b5;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            G
        </div>

        <h1>
            Game Portal
        </h1>

        <p class="subtitle">
            원하는 게임 페이지를 선택하세요
        </p>

        <div class="links">

            <!-- 운석서바이버 -->
            <a href="../54/game.html" class="game-link">
                <span>
                    운석서바이버
                </span>
            </a>

            <!-- 도시철도 -->
            <a href="subway.html" class="game-link">
                <span>
                    도시철도
                </span>
            </a>

            <!-- 처음에는 이것만 보임 -->
            <a href="#" class="game-link" id="detailButton">
                <span>
                    자세히 보기
                </span>
            </a>

            <!-- 자세히 보기를 누르면 나타남 -->
            <div id="hiddenGames">

                <!-- 운석수학서바이버 -->
                <a href="mathgame.html" class="game-link">
                    <span>
                        운석수학서바이버
                    </span>
                </a>

                <!-- 공룡 달리기 -->
                <a href="dino.html" class="game-link">
                    <span>
                        영현이의 공룡 달리기 게임
                    </span>
                </a>

            </div>

        </div>

        <div class="footer">
            © Game Portal
        </div>

    </main>


    <script>

        const detailButton =
            document.getElementById("detailButton");

        const hiddenGames =
            document.getElementById("hiddenGames");


        detailButton.addEventListener("click", function(event) {

            event.preventDefault();

            hiddenGames.classList.toggle("show");


            if (hiddenGames.classList.contains("show")) {

                detailButton.querySelector("span").textContent =
                    "닫기";

            } else {

                detailButton.querySelector("span").textContent =
                    "자세히 보기";

            }

        });

    </script>

</body>
</html>
